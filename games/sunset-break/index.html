<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sunset Break — playable crash-game prototype (surf theme, live-presenter concept). Internal hackathon demo, demo credits only.">
<meta name="color-scheme" content="dark">
<style>
  html{color-scheme:dark;}
  body{margin:0;font:14px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0b0220;}
  img{max-width:100%;}
  [hidden]{display:none!important;}
</style>
<title>Sunset Break</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --deep:#17053a;
    --grape:#46107a;
    --abyss:#0b0220;
    --panel:#1a0942;
    --panel-2:#25105c;
    --hot:#ff2e88;
    --tangerine:#ff9f1c;
    --aqua:#21e6c1;
    --sand:#ffe6c7;
    --dim:#a68fd6;
    --edge:#6b3fb5;
    --win:#21e6c1;
    --lose:#ff2e88;
    --display:"Monoton",cursive;
    --hud:"Chakra Petch","Segoe UI",sans-serif;
    --ui:"Barlow Semi Condensed","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 70% -10%, #3d0f6e 0%, transparent 60%),
      linear-gradient(180deg,#12042e 0%, var(--abyss) 100%);
    color:var(--sand);
    font-family:var(--ui);
    padding:20px 16px 28px;
    min-height:100vh;
  }
  .cab{ max-width:1160px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }

  /* ---------- marquee ---------- */
  .marquee{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:14px 20px;
    border:1px solid var(--edge);
    border-radius:14px 14px 4px 4px;
    background:linear-gradient(180deg, rgba(70,16,122,.85), rgba(26,9,66,.9));
    box-shadow:0 0 0 1px rgba(255,46,136,.18), 0 18px 40px -22px #000;
  }
  .logo{ display:flex; align-items:baseline; gap:12px; }
  .logo h1{
    font-family:var(--display); font-weight:400; font-size:clamp(24px,4.4vw,38px);
    margin:0; color:var(--hot); letter-spacing:.02em; line-height:1;
    text-shadow:0 0 6px #ff2e88, 0 0 22px #ff2e8899, 0 0 46px #ff2e8855;
  }
  .logo .tag{
    font-family:var(--ui); font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--tangerine); white-space:nowrap;
  }
  .wallet{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .stat{
    border:1px solid var(--edge); border-radius:10px; padding:6px 14px;
    background:rgba(11,2,32,.7); min-width:106px;
  }
  .stat .k{ display:block; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  .stat .v{ font-family:var(--hud); font-weight:700; font-size:19px; font-variant-numeric:tabular-nums; }
  .stat .v.pos{ color:var(--win); }
  .stat .v.neg{ color:var(--lose); }
  .demo{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--abyss);
    background:var(--tangerine); padding:5px 10px; border-radius:6px; font-weight:700;
  }
  .snd{
    display:flex; align-items:center; gap:9px; cursor:pointer;
    background:rgba(11,2,32,.7); border:1px solid var(--edge); color:var(--dim);
    font-family:var(--ui); font-size:12px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; padding:7px 13px; border-radius:10px;
    transition:color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .snd:hover{ color:var(--sand); border-color:var(--hot); }
  .snd[aria-pressed="true"]{
    color:var(--aqua); border-color:var(--aqua); box-shadow:0 0 16px -4px var(--aqua);
  }
  .eq{ display:flex; align-items:flex-end; gap:2px; height:14px; }
  .eq i{ width:3px; height:4px; background:currentColor; border-radius:1px; }
  .snd[aria-pressed="true"] .eq i{ animation:bounce .9s ease-in-out infinite; }
  .snd[aria-pressed="true"] .eq i:nth-child(2){ animation-duration:.62s; }
  .snd[aria-pressed="true"] .eq i:nth-child(3){ animation-duration:1.1s; }
  .snd[aria-pressed="true"] .eq i:nth-child(4){ animation-duration:.78s; }
  @keyframes bounce{ 0%,100%{ height:4px; } 50%{ height:14px; } }

  /* ---------- board ---------- */
  .board{ display:grid; grid-template-columns:1fr 262px; gap:14px; align-items:stretch; }
  .stage{
    position:relative; border:1px solid var(--edge); border-radius:14px; overflow:hidden;
    background:var(--deep); box-shadow:0 24px 60px -30px #000, inset 0 0 60px rgba(255,46,136,.08);
    min-height:400px;
  }
  canvas{ display:block; width:100%; height:100%; position:absolute; inset:0; }

  .history{
    position:absolute; top:0; left:0; right:0; z-index:3;
    display:flex; gap:6px; padding:10px 12px; overflow-x:auto; scrollbar-width:none;
    background:linear-gradient(180deg, rgba(11,2,32,.78), transparent);
  }
  .history::-webkit-scrollbar{ display:none; }
  .pip{
    font-family:var(--hud); font-weight:600; font-size:12px; font-variant-numeric:tabular-nums;
    padding:3px 9px; border-radius:999px; white-space:nowrap; border:1px solid transparent;
  }
  .pip.low{ color:#9fd8ff; border-color:#3b6ea8; background:rgba(28,60,102,.5); }
  .pip.mid{ color:var(--aqua); border-color:#1c8f7d; background:rgba(11,64,58,.5); }
  .pip.high{ color:var(--tangerine); border-color:#a3691a; background:rgba(78,44,6,.6); }
  .pip.epic{ color:#fff; border-color:var(--hot); background:rgba(255,46,136,.35); box-shadow:0 0 12px rgba(255,46,136,.55); }

  .hud{
    position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; pointer-events:none; text-align:center;
    padding:44px 16px 0;
  }
  .mult{
    font-family:var(--hud); font-weight:700; font-variant-numeric:tabular-nums;
    font-size:clamp(52px,9.5vw,92px); line-height:.95; letter-spacing:-.02em;
    color:var(--aqua); text-shadow:0 0 10px currentColor, 0 0 36px rgba(33,230,193,.5);
    transition:color .25s ease;
  }
  .mult.bonus{ color:var(--tangerine); text-shadow:0 0 12px currentColor, 0 0 44px rgba(255,159,28,.6); }
  .mult.bust{ color:var(--hot); text-shadow:0 0 12px currentColor, 0 0 44px rgba(255,46,136,.6); }
  .state{
    margin-top:6px; font-size:13px; letter-spacing:.24em; text-transform:uppercase; color:var(--sand);
    opacity:.85;
  }
  .flash{
    margin-top:14px; font-family:var(--hud); font-weight:700; font-size:clamp(15px,2.6vw,21px);
    letter-spacing:.16em; text-transform:uppercase; padding:7px 18px; border-radius:8px;
    opacity:0; transform:translateY(6px); transition:opacity .18s ease, transform .18s ease;
  }
  .flash.show{ opacity:1; transform:translateY(0); }
  .flash.up{ color:var(--abyss); background:var(--tangerine); box-shadow:0 0 26px rgba(255,159,28,.7); }
  .flash.out{ color:var(--abyss); background:var(--aqua); box-shadow:0 0 26px rgba(33,230,193,.7); }
  .flash.bust{ color:#fff; background:var(--hot); box-shadow:0 0 26px rgba(255,46,136,.7); }

  /* ---------- rail ---------- */
  .rail{
    border:1px solid var(--edge); border-radius:14px; background:rgba(11,2,32,.62);
    display:flex; flex-direction:column; overflow:hidden; min-height:400px;
  }
  .rail h2{
    margin:0; padding:11px 14px; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--dim); border-bottom:1px solid rgba(107,63,181,.5); font-weight:600;
    display:flex; justify-content:space-between; align-items:center;
  }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--aqua); box-shadow:0 0 8px var(--aqua); }
  .feed{ list-style:none; margin:0; padding:6px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:4px; }
  .feed li{
    display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center;
    padding:6px 9px; border-radius:8px; background:rgba(37,16,92,.5);
    font-size:13px; animation:slide .22s ease;
  }
  .feed li.me{ background:rgba(33,230,193,.14); border:1px solid rgba(33,230,193,.45); }
  .feed .who{ color:var(--sand); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:.04em; }
  .feed .at{ font-family:var(--hud); font-weight:600; font-variant-numeric:tabular-nums; color:var(--aqua); }
  .feed li.bust .at{ color:var(--hot); }
  .feed .pay{ font-family:var(--hud); font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; }
  @keyframes slide{ from{ opacity:0; transform:translateX(-8px);} to{ opacity:1; transform:none;} }

  /* ---------- console ---------- */
  .console{
    border:1px solid var(--edge); border-radius:4px 4px 14px 14px;
    background:linear-gradient(180deg, rgba(37,16,92,.9), rgba(11,2,32,.95));
    padding:16px; display:grid; grid-template-columns:1fr 1fr 1.25fr; gap:16px; align-items:end;
    box-shadow:inset 0 1px 0 rgba(255,230,199,.12);
  }
  .field label{
    display:block; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
    margin-bottom:6px; font-weight:600;
  }
  .spin{ display:flex; gap:6px; }
  input[type="number"]{
    flex:1; min-width:0; background:var(--abyss); border:1px solid var(--edge); color:var(--sand);
    font-family:var(--hud); font-weight:600; font-size:17px; font-variant-numeric:tabular-nums;
    padding:9px 11px; border-radius:8px; -moz-appearance:textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input:focus-visible, button:focus-visible{ outline:2px solid var(--tangerine); outline-offset:2px; }
  .mini{
    background:var(--panel-2); border:1px solid var(--edge); color:var(--sand);
    font-family:var(--hud); font-weight:600; font-size:13px; padding:0 11px; border-radius:8px;
    cursor:pointer; transition:background .15s ease;
  }
  .mini:hover{ background:#33167a; }
  .chips{ display:flex; gap:6px; margin-top:7px; flex-wrap:wrap; }
  .chip{
    flex:1; min-width:44px; background:rgba(255,230,199,.06); border:1px solid rgba(107,63,181,.7);
    color:var(--dim); font-family:var(--hud); font-size:12px; font-weight:600; padding:5px 0;
    border-radius:7px; cursor:pointer; transition:.15s ease;
  }
  .chip:hover{ color:var(--sand); border-color:var(--tangerine); }
  .act{
    width:100%; border:none; border-radius:12px; cursor:pointer;
    font-family:var(--hud); font-weight:700; font-size:clamp(16px,2.4vw,21px); letter-spacing:.06em;
    text-transform:uppercase; padding:17px 12px; color:var(--abyss);
    background:linear-gradient(180deg,#ffd166,var(--tangerine));
    box-shadow:0 6px 0 #a35f07, 0 14px 26px -10px rgba(255,159,28,.6);
    transition:transform .06s ease, box-shadow .06s ease, background .2s ease;
    font-variant-numeric:tabular-nums;
  }
  .act:active{ transform:translateY(4px); box-shadow:0 2px 0 #a35f07; }
  .act.cash{ background:linear-gradient(180deg,#7ef6e0,var(--aqua)); box-shadow:0 6px 0 #0f7d6c, 0 14px 26px -10px rgba(33,230,193,.6); }
  .act.cancel{ background:linear-gradient(180deg,#ff87b8,var(--hot)); color:#fff; box-shadow:0 6px 0 #96144d, 0 14px 26px -10px rgba(255,46,136,.6); }
  .act[disabled]{ background:linear-gradient(180deg,#4b3a6b,#33285c); color:#8f7fb5; box-shadow:0 6px 0 #241a45; cursor:not-allowed; }
  .note{ margin-top:8px; font-size:11.5px; color:var(--dim); letter-spacing:.04em; text-align:center; }

  @media (max-width:860px){
    .board{ grid-template-columns:1fr; }
    .rail{ min-height:auto; max-height:190px; }
    .stage{ min-height:340px; }
    .console{ grid-template-columns:1fr 1fr; }
    .field.go{ grid-column:1 / -1; }
  }
  @media (max-width:430px){
    body{ padding:14px 12px 22px; }
    .console{ grid-template-columns:1fr; }
    .stat{ min-width:88px; padding:5px 10px; }
  }
  @media (prefers-reduced-motion:reduce){
    .feed li{ animation:none; }
    .flash{ transition:none; }
    .snd[aria-pressed="true"] .eq i{ animation:none; height:10px; }
  }
</style>
</head>
<body>
<div class="cab">

  <header class="marquee">
    <div class="logo">
      <h1>Sunset Break</h1>
      <span class="tag">Crash &middot; Live Surf</span>
    </div>
    <div class="wallet">
      <button class="snd" id="snd" type="button" aria-pressed="false">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span id="sndLabel">Music off</span>
      </button>
      <span class="demo">Demo credits</span>
      <div class="stat">
        <span class="k">Balance</span>
        <span class="v" id="balance">2,500</span>
      </div>
      <div class="stat">
        <span class="k">Session</span>
        <span class="v" id="net">0</span>
      </div>
    </div>
  </header>

  <div class="board">
    <section class="stage">
      <canvas id="scene"></canvas>
      <div class="history" id="history"></div>
      <div class="hud">
        <div class="mult" id="mult">1.00x</div>
        <div class="state" id="state">Next wave in 6.0s</div>
        <div class="flash" id="flash"></div>
      </div>
    </section>

    <aside class="rail">
      <h2>In the water <span class="live-dot"></span></h2>
      <ul class="feed" id="feed"></ul>
    </aside>
  </div>

  <section class="console">
    <div class="field">
      <label for="bet">Bet</label>
      <div class="spin">
        <button class="mini" id="half" type="button">&frac12;</button>
        <input type="number" id="bet" value="25" min="1" step="1" inputmode="numeric">
        <button class="mini" id="double" type="button">2&times;</button>
      </div>
      <div class="chips">
        <button class="chip" type="button" data-add="10">+10</button>
        <button class="chip" type="button" data-add="50">+50</button>
        <button class="chip" type="button" data-add="100">+100</button>
      </div>
    </div>

    <div class="field">
      <label for="auto">Auto cash out</label>
      <div class="spin">
        <input type="number" id="auto" placeholder="off" min="1.01" step="0.1" inputmode="decimal">
        <button class="mini" id="clearAuto" type="button">Off</button>
      </div>
      <div class="chips">
        <button class="chip" type="button" data-auto="1.5">1.50x</button>
        <button class="chip" type="button" data-auto="2">2.00x</button>
        <button class="chip" type="button" data-auto="5">5.00x</button>
      </div>
    </div>

    <div class="field go">
      <button class="act" id="action" type="button">Place bet</button>
      <p class="note" id="note">He carves up the face as your stake climbs. The bonus turns him gold and sends him down the line &mdash; multipliers climb ~3&times; faster.</p>
    </div>
  </section>

</div>

<script type="module" src="./main.ts"></script>

</body>
</html>
