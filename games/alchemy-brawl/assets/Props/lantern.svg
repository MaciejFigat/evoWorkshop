<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
  <filter id="tex" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.07  0 0 0 0 0.04  0.8 0 0 0 -0.3" result="a"/>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="t"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.35" numOctaves="3" seed="2" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.07  0 0 0 0 0.03  1.3 0 0 0 -0.45" result="a"/>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="t"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>

  <linearGradient id="woodH" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#3a2614"/><stop offset=".35" stop-color="#8a5c33"/>
    <stop offset=".55" stop-color="#9c6b3d"/><stop offset="1" stop-color="#3a2614"/></linearGradient>
  <linearGradient id="woodV" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#a5733f"/><stop offset=".5" stop-color="#7a5129"/><stop offset="1" stop-color="#3f2913"/></linearGradient>
  <linearGradient id="iron" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#b9bcc0"/><stop offset=".45" stop-color="#6b6f74"/><stop offset="1" stop-color="#2e3033"/></linearGradient>
  <linearGradient id="ironH" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#2e3033"/><stop offset=".4" stop-color="#9ea2a7"/><stop offset=".6" stop-color="#7d8186"/><stop offset="1" stop-color="#2e3033"/></linearGradient>
  <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffe7a3"/><stop offset=".45" stop-color="#d4a64a"/><stop offset="1" stop-color="#6e4f17"/></linearGradient>
  <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>

  <radialGradient id="glass" cx=".5" cy=".62" r=".6">
    <stop offset="0" stop-color="#eaffd9"/><stop offset=".3" stop-color="#8ff0b4"/><stop offset=".7" stop-color="#2fbf8f"/><stop offset="1" stop-color="#0d3f2f"/></radialGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#7dffb8" stop-opacity=".55"/><stop offset="1" stop-color="#7dffb8" stop-opacity="0"/></radialGradient>
  <radialGradient id="flame" cx=".5" cy=".7" r=".6">
    <stop offset="0" stop-color="#fffbe6"/><stop offset=".5" stop-color="#ffd25a"/><stop offset="1" stop-color="#f08a24"/></radialGradient>
</defs>

<circle cx="64" cy="68" r="52" fill="url(#halo)"/>
<g filter="url(#tex)">

<circle cx="64" cy="11" r="6" fill="none" stroke="url(#gold)" stroke-width="4"/>
<circle cx="64" cy="11" r="6" fill="none" stroke="#1c130b" stroke-width="1" opacity=".6"/>
<path d="M44 35 L64 18 L84 35 Z" fill="url(#gold)" stroke="#1c130b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M64 18 L64 35" stroke="#1c130b" stroke-opacity=".4" stroke-width="1.5"/>
<rect x="40" y="34" width="48" height="7" rx="2" fill="url(#gold)" stroke="#1c130b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="46" y="41" width="36" height="50" fill="url(#glass)" stroke="#1c130b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="60.5" y="70" width="7" height="20" rx="1.5" fill="#efe6cf" stroke="#1c130b" stroke-width="1.5"/>
<ellipse cx="64" cy="66" rx="9" ry="11" fill="#fff6c8" opacity=".55" filter="url(#soft)"/>
<path d="M64 55 C69 62 68.5 68 64 70 C59.5 68 59 62 64 55 Z" fill="url(#flame)" stroke="#a04e10" stroke-width="1"/>
<rect x="43" y="40" width="5" height="52" fill="url(#gold)" stroke="#1c130b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="80" y="40" width="5" height="52" fill="url(#gold)" stroke="#1c130b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M48 54 H80" stroke="url(#gold)" stroke-width="3"/>
<path d="M50 44 L50 88" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
<rect x="40" y="91" width="48" height="7" rx="2" fill="url(#gold)" stroke="#1c130b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M46 98 H82 L78 106 H50 Z" fill="url(#gold)" stroke="#1c130b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</g>
</svg>
