<ellipse cx="640" cy="360" rx="626" ry="336" fill="url(#rimW)" stroke="#1c130b" stroke-width="4" filter="url(#grain)"/>
<ellipse cx="640" cy="360" rx="604" ry="314" fill="none" stroke="url(#gold)" stroke-width="5"/>
<ellipse cx="640" cy="360" rx="590" ry="300" fill="url(#felt)" stroke="#1c130b" stroke-width="3" filter="url(#feltTex)"/>
