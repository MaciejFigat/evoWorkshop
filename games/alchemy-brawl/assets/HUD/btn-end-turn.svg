<circle cx="64" cy="64" r="44" fill="none" stroke="#1c130b" stroke-width="1.2"/>
<circle cx="64" cy="64" r="38" fill="none" stroke="#5a1a06" stroke-opacity=".6" stroke-width="1.5"/>
