<style>
/* Layout: sticky top bar, one centred content column; game grid for browsing, dense panels and tables for stats. */
:root {
  --ink: #0F1011;
  --surface: #17191A;
  --surface-2: #1F2223;
  --surface-3: #272B2C;
  --rule: #2B2E2F;
  --rule-strong: #3A3E3F;
  --paper: #F2F3EE;
  --muted: #A6AAA0;
  --faint: #868A80;
  --lime: #C6F432;
  --lime-hover: #D6FB64;
  --lime-tint: rgba(198, 244, 50, 0.1);
  --on-lime: #0F1011;
  --good: #6FCF8E;
  --warn: #E9B44C;
  --bad: #F2836B;
  --info: #7DB2EC;
  --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--ink); }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(15, 16, 17, 0.92);
  backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--rule);
}
.topbar-inner { max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 28px; }
.brand img { height: 34px; width: auto; }
.nav { display: flex; gap: 4px; flex: none; min-width: 0; }
.nav a {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: var(--r-sm);
  color: var(--muted); font-weight: 600; font-size: 15px; white-space: nowrap;
  transition: color 120ms ease-out, background-color 120ms ease-out;
}
.nav a:hover { color: var(--paper); background: var(--surface-2); }
.nav a .tri { width: 8px; height: 10px; opacity: 0; transition: opacity 120ms ease-out; }
.nav a.active { color: var(--paper); }
.nav a.active .tri { opacity: 1; }
.top-actions { display: flex; align-items: center; gap: 12px; }
.top-search { position: relative; flex: 1; max-width: 400px; margin-left: auto; }
.top-search > svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.top-search input[type="search"] { width: 100%; height: 38px; padding: 0 34px 0 34px; background: var(--surface); border-color: var(--rule); }
.top-search input[type="search"]::-webkit-search-cancel-button { display: none; }
.top-search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 6px; line-height: 18px; pointer-events: none; }
.top-search input:focus ~ kbd { display: none; }
.search-results { position: absolute; top: 46px; left: 0; right: 0; min-width: 340px; max-height: 70vh; overflow-y: auto; z-index: 45; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--r-md); box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45); padding: 6px; }
.sr-group { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 4px; }
.sr-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; }
.sr-item.on, .sr-item:hover { background: var(--surface-3); }
.sr-thumb { width: 56px; flex: none; border-radius: 4px; }
.sr-text { display: flex; flex-direction: column; min-width: 0; }
.sr-text b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-text span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sr-empty { padding: 14px 10px; color: var(--muted); font-size: 14px; margin: 0; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: var(--r-sm);
  border: 1px solid var(--rule-strong); background: var(--surface);
  font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: background-color 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out;
}
.btn:hover { background: var(--surface-2); border-color: #4A4F50; }
.btn-primary { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
.btn-primary:hover { background: var(--lime-hover); border-color: var(--lime-hover); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn-lg { height: 48px; padding: 0 22px; font-size: 16px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.link { color: var(--paper); text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--lime); }

/* User chip and menu */
.user { position: relative; }
.user-chip { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px 0 4px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); }
.user-chip:hover { border-color: var(--rule-strong); }
.user-chip .who { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
.user-chip .who b { font-size: 13px; }
.user-chip .who span { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.menu {
  position: absolute; right: 0; top: 48px; width: 280px; z-index: 40;
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--r-md);
  box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
  padding: 8px;
}
.menu-head { display: flex; gap: 12px; align-items: center; padding: 8px 8px 12px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
.menu-head .okta { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.menu-head .okta i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
.menu a, .menu button.item { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 8px; border-radius: var(--r-sm); background: none; border: 0; font-size: 14px; text-align: left; }
.menu a:hover, .menu button.item:hover { background: var(--surface-2); }
.menu .sep { height: 1px; background: var(--rule); margin: 6px 0; }
.menu label { display: block; padding: 6px 8px 2px; font-size: 11px; font-family: var(--mono); color: var(--muted); }
.menu select { margin: 4px 8px 8px; width: calc(100% - 16px); }

.avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-3); color: var(--paper); font-weight: 700; font-size: 13px;
  border: 1px solid var(--rule-strong);
}
.avatar.sm { width: 22px; height: 22px; font-size: 10px; }
.avatar.lg { width: 56px; height: 56px; font-size: 20px; }
.avatar.me { border-color: var(--lime); box-shadow: 0 0 0 1px var(--lime); }

/* Page */
main { max-width: 1360px; margin: 0 auto; padding: 28px 32px 80px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
.page-head p { color: var(--muted); margin-top: 4px; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
.crumbs a:hover { color: var(--paper); }
.section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-head h2 { font-size: 20px; font-weight: 700; }
.section-head a { color: var(--muted); font-size: 14px; }
.section-head a:hover { color: var(--paper); }
.label { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* Lobby */
.top-games { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.side-games { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 12px; }
.side-game { display: grid; grid-template-columns: 44% minmax(0, 1fr); border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); overflow: hidden; transition: border-color 140ms ease-out; }
.side-game:hover { border-color: var(--rule-strong); }
.side-game .cover { aspect-ratio: auto; height: 100%; min-height: 110px; }
.side-game-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side-game-body h3 { font-size: 16px; font-weight: 700; }
.side-game-body h3 a:hover { color: var(--lime); }
.side-game-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.featured { position: relative; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--rule); background: var(--surface); display: flex; flex-direction: column; }
.featured .cover { aspect-ratio: 16 / 9; flex: 1; }
.featured-body { padding: 16px 18px 18px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.featured-body h3 { font-size: 22px; font-weight: 800; }
.featured-flag { position: absolute; top: 12px; left: 12px; }


/* Covers */
.cover { position: relative; aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; }
.cover img, .cover svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .badges { position: absolute; inset: 10px 10px auto 10px; display: flex; justify-content: space-between; gap: 6px; pointer-events: none; }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px;
  border-radius: 4px; border: 1px solid var(--rule-strong); background: rgba(15,16,17,.82);
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--paper); white-space: nowrap;
}
.chip.rng::before, .chip.arcade::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.chip.rng::before { background: var(--lime); }
.chip.arcade::before { background: var(--paper); }
.chip.quiet { color: var(--muted); background: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Game grid and cards */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card {
  display: flex; flex-direction: column; border-radius: var(--r-md); overflow: hidden;
  background: var(--surface); border: 1px solid var(--rule);
  transition: border-color 140ms ease-out, transform 140ms ease-out;
}
.card:hover { border-color: var(--rule-strong); transform: translateY(-2px); }
.card-link { display: flex; flex-direction: column; flex: 1; }
.card-body { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-body h3 { font-size: 17px; font-weight: 700; }
.card-body .tagline { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.byline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.byline b { color: var(--paper); font-weight: 600; }
.card-foot { display: flex; align-items: center; gap: 12px; padding: 10px 14px 12px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
.card-foot .spacer { flex: 1; }
.card-foot .spark { display: block; }
.metric { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.metric svg { width: 14px; height: 14px; }

.vote {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-sm);
  border: 1px solid var(--rule-strong); background: transparent; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  transition: background-color 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out;
}
.vote:hover { border-color: var(--lime); }
.vote svg { width: 10px; height: 10px; }
.vote.on { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
.vote.lg { height: 40px; padding: 0 14px; font-size: 15px; }
.vote.lg svg { width: 12px; height: 12px; }

/* Library toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--r-sm); overflow: hidden; flex-wrap: wrap; }
.seg button { height: 34px; padding: 0 12px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg button:hover { color: var(--paper); background: var(--surface-2); }
.seg button.on { background: var(--paper); color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.active-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 18px; min-height: 24px; font-size: 13px; color: var(--muted); }
.filter-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border: 1px solid var(--rule-strong); border-radius: 999px; color: var(--paper); font-size: 13px; background: transparent; }
.filter-chip button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.filter-chip button:hover { background: var(--surface-3); color: var(--paper); }

/* Forms */
input[type="text"], input[type="url"], input[type="search"], select, textarea {
  height: 36px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--rule-strong);
  background: var(--ink); color: var(--paper); font-size: 14px;
}
textarea { height: auto; padding: 10px; line-height: 1.5; resize: vertical; width: 100%; }
select { padding-right: 28px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
input[type="file"] { font-size: 13px; color: var(--muted); max-width: 100%; }
input[type="file"]::file-selector-button { height: 32px; margin-right: 12px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--rule-strong); background: var(--surface-2); color: var(--paper); font: inherit; font-weight: 600; cursor: pointer; }
input[type="file"]::file-selector-button:hover { background: var(--surface-3); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--lime); box-shadow: 0 0 0 3px var(--lime-tint); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; }
.field small { color: var(--muted); font-size: 12px; }
.field .err { color: var(--bad); font-size: 12px; }
.field input, .field select { width: 100%; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.form-grid .wide { grid-column: 1 / -1; }
.idea-form { max-width: 760px; }
.idea-form-actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
.idea-status { font-size: 13px; }
.idea-status.ok { color: var(--good); }
.idea-status.err { color: var(--bad); }

/* Panels, tiles, tables */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 18px 20px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.panel-head .note { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 -1px -1px 0; }
.tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.tile .s { font-size: 12px; color: var(--muted); }
.tile.accent { background: var(--lime-tint); }
.cols-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.cols-3-1 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; }
.stack { display: flex; flex-direction: column; gap: 20px; }

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
table.data td { padding: 9px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tbody tr { transition: background-color 80ms ease-out; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data tr.me { background: var(--lime-tint); }
table.data tr.clickable { cursor: pointer; }
.rank { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.rank.top { color: var(--lime); font-weight: 600; }
.inline-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--lime); vertical-align: middle; margin-right: 8px; opacity: .85; }
.who-cell { display: flex; align-items: center; gap: 10px; }
.who-cell b { font-weight: 600; }
.who-cell span { color: var(--muted); font-size: 12px; }

/* Charts */
.chart { width: 100%; min-height: 40px; }
.chart svg { display: block; overflow: visible; }
.chart .axis { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.chart .end-label { fill: var(--paper); font-family: var(--mono); font-size: 12px; font-weight: 600; }
.chart-tooltip { position: fixed; z-index: 100; pointer-events: none; background: var(--surface-3); border: 1px solid var(--rule-strong); border-radius: var(--r-sm); padding: 6px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 1px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.chart-tooltip b { font-weight: 600; }
.chart-tooltip span { color: var(--muted); font-family: var(--mono); }
.heat-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.heat-legend i { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }
.heat-legend span { margin: 0 4px; }
.heat-legend .heat-legend-max { margin-left: auto; font-family: var(--mono); }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) 72px; gap: 12px; align-items: center; font-size: 14px; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar a.name:hover { color: var(--lime); }
.hbar .track { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.hbar .fill { height: 100%; border-radius: 4px; background: var(--lime); }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.split { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; }
.split > div { height: 100%; }
.split-legend { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; gap: 12px; }
.split-legend b { font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.view-toggle { display: inline-flex; gap: 4px; }
.view-toggle button { height: 26px; padding: 0 10px; border-radius: 4px; border: 1px solid var(--rule-strong); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; }
.view-toggle button.on { color: var(--paper); background: var(--surface-3); }
.callout { font-size: 14px; margin-top: 12px; color: var(--muted); }
.callout b { color: var(--paper); }

/* Game details */
.detail-head { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.detail-cover { border-radius: var(--r-lg); overflow: hidden; position: relative; border: 1px solid var(--rule); }
.cover-play { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; border: 0; background: rgba(15, 16, 17, 0.28); color: var(--paper); font-weight: 700; font-size: 15px; transition: background-color 140ms ease-out; }
.cover-play:hover { background: rgba(15, 16, 17, 0.45); }
.cover-play .ring { width: 76px; height: 76px; border-radius: 50%; background: var(--lime); color: var(--on-lime); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45); transition: transform 140ms ease-out; }
.cover-play:hover .ring { transform: scale(1.06); }
.cover-play .ring svg { margin-left: 4px; }
.cover-play > span:last-child { background: rgba(15, 16, 17, 0.7); padding: 4px 10px; border-radius: 4px; }
.player-slot { width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 120px); min-height: 360px; margin-bottom: 24px; border-radius: var(--r-lg); background: #000; }
.detail-head.playing { grid-template-columns: minmax(0, 1fr); }
.inline-player { position: absolute; z-index: 20; width: auto; height: auto; box-shadow: none; }
.player:fullscreen { width: 100vw; height: 100vh; border-radius: 0; border: 0; }
.detail-cover .cover { aspect-ratio: 16 / 9; }
.detail-info { display: flex; flex-direction: column; gap: 14px; }
.detail-info h1 { font-size: 38px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; }
.detail-info .tagline { font-size: 17px; color: var(--muted); }
.detail-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); padding-top: 14px; gap: 12px; }
.facts div { display: flex; flex-direction: column; gap: 2px; }
.facts b { font-size: 20px; font-weight: 700; }
.facts span { font-size: 12px; color: var(--muted); }
.rate { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.rate .scale { display: inline-flex; gap: 4px; }
.rate .scale button { width: 32px; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--rule-strong); background: transparent; font-weight: 700; font-variant-numeric: tabular-nums; }
.rate .scale button:hover { border-color: var(--lime); }
.rate .scale button.on { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin: 32px 0 24px; overflow-x: auto; }
.tabs a { padding: 12px 14px; color: var(--muted); font-weight: 600; font-size: 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs a:hover { color: var(--paper); }
.tabs a.on { color: var(--paper); border-bottom-color: var(--lime); }
.tabs a .count { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--surface-3); border-radius: 4px; padding: 1px 6px; }

.passport dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 16px; margin: 0; font-size: 14px; }
.passport dt { color: var(--muted); font-family: var(--mono); font-size: 12px; padding-top: 2px; }
.passport dd { margin: 0; }

.readme { max-width: 760px; font-size: 15px; line-height: 1.65; }
.readme h1 { font-size: 26px; margin: 0 0 12px; }
.readme h2 { font-size: 18px; margin: 24px 0 8px; }
.readme p { margin: 0 0 12px; color: #D9DBD3; }
.readme ul { margin: 0 0 12px; padding-left: 20px; color: #D9DBD3; }
.readme li { margin: 4px 0; }
.readme code { font-family: var(--mono); font-size: 13px; background: var(--surface-3); padding: 1px 6px; border-radius: 4px; }
.readme pre { background: var(--ink); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 12px 14px; overflow-x: auto; margin: 0 0 12px; }
.readme pre code { background: none; padding: 0; }

.video { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
.video-frame { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--rule); background: #000; }
.video-frame .cover { position: absolute; inset: 0; aspect-ratio: auto; height: 100%; opacity: .45; }
.video-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: none; border: 0; }
.video-play .ring { width: 72px; height: 72px; border-radius: 50%; background: var(--lime); display: flex; align-items: center; justify-content: center; transition: transform 140ms ease-out; }
.video-play:hover .ring { transform: scale(1.06); }
.video-play span { font-family: var(--mono); font-size: 13px; }
.video-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.15); }
.video-bar i { display: block; height: 100%; background: var(--lime); width: 0; transition: width 200ms ease-out; }
.chapters { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.chapters button { display: flex; width: 100%; gap: 14px; padding: 10px 8px; background: none; border: 0; border-bottom: 1px solid var(--rule); text-align: left; font-size: 14px; }
.chapters button:hover { background: var(--surface-2); }
.chapters button.on { color: var(--lime); }
.chapters .t { font-family: var(--mono); color: var(--muted); width: 40px; font-variant-numeric: tabular-nums; }

.comments { display: flex; flex-direction: column; gap: 4px; max-width: 820px; }
.comment { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.comment-head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.comment-head b { color: var(--paper); font-size: 14px; }
.comment p { margin-top: 4px; font-size: 15px; }
.comment .like { margin-top: 8px; height: 26px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--rule); background: transparent; color: var(--muted); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.comment .like.on { color: var(--lime); border-color: var(--lime); }
.comment-form { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; margin-bottom: 8px; }
.comment-form .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 12px; font-size: 12px; color: var(--muted); }

.empty { border: 1px dashed var(--rule-strong); border-radius: var(--r-md); padding: 28px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--paper); font-size: 16px; }

/* Player overlay */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(5,6,6,.82); display: flex; align-items: center; justify-content: center; padding: 24px; }
.player { width: min(1200px, 100%); height: min(780px, 100%); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--r-lg); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.6); }
.player-bar { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--rule); }
.player-bar h3 { font-size: 16px; font-weight: 700; }
.player-bar .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.player-bar .spacer { flex: 1; }
.player-bar .seed { display: inline-flex; align-items: center; gap: 6px; }
.player-bar .seed input[type="text"] { width: 72px; height: 28px; padding: 0 8px; font-family: var(--mono); font-size: 12px; }
.player iframe { flex: 1; width: 100%; border: 0; background: #000; }
.player-msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; color: var(--muted); }
.player-msg b { color: var(--paper); font-size: 20px; }
.player-msg pre { font-family: var(--mono); font-size: 14px; color: var(--paper); background: var(--ink); border: 1px solid var(--rule); padding: 10px 16px; border-radius: var(--r-sm); margin: 0; }
.want-more { position: fixed; z-index: 70; right: 24px; bottom: 24px; width: 320px; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: var(--r-md); padding: 16px; box-shadow: 0 16px 48px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 10px; }
.want-more .row { display: flex; justify-content: space-between; align-items: center; }

.toast { position: fixed; z-index: 90; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: var(--r-sm); font-weight: 600; font-size: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.45); display: flex; gap: 8px; align-items: center; }

/* Wizard */
.wizard { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 88px; }
.steps button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: var(--r-sm); background: none; border: 0; text-align: left; color: var(--muted); font-weight: 600; }
.steps button:hover { background: var(--surface-2); color: var(--paper); }
.steps .n { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--rule-strong); display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; }
.steps button.on { color: var(--paper); background: var(--surface); }
.steps button.on .n { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
.steps button.done .n { border-color: var(--lime); color: var(--lime); }
.wizard-body { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.wizard-foot { display: flex; justify-content: space-between; gap: 12px; padding-top: 8px; }
.choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.choice-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--rule-strong); border-radius: var(--r-md); background: var(--ink); cursor: pointer; transition: border-color 120ms ease-out, background-color 120ms ease-out; }
.choice:hover { border-color: #545a5b; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice b { font-size: 15px; display: flex; align-items: center; gap: 8px; }
.choice span { font-size: 13px; color: var(--muted); }
.choice.on { border-color: var(--lime); background: var(--lime-tint); }
.choice:focus-within { box-shadow: 0 0 0 3px var(--lime-tint); }
.drop { border: 1.5px dashed var(--rule-strong); border-radius: var(--r-md); padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--muted); background: var(--ink); transition: border-color 120ms ease-out, background-color 120ms ease-out; }
.drop.over { border-color: var(--lime); background: var(--lime-tint); }
.drop b { color: var(--paper); }
.file-ok { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface-2); font-size: 14px; }
.file-ok .mono { color: var(--muted); font-size: 12px; }
.review { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; }
.check-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.check-list li { display: flex; gap: 10px; align-items: center; }
.check-list .ok { color: var(--good); }
.check-list .miss { color: var(--warn); }

/* Manage */
.manage-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px; border: 1px solid var(--rule); border-radius: var(--r-md); background: var(--surface); }
.manage-row .cover { border-radius: var(--r-sm); }
.manage-row h3 { font-size: 17px; }
.manage-row .meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.manage-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.manage-row.hidden-game { opacity: .6; }

/* Drawer */
.drawer-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(5,6,6,.6); display: flex; justify-content: flex-end; }
.drawer { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--rule-strong); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.drawer-head { display: flex; gap: 14px; align-items: center; }
.drawer-head h2 { font-size: 24px; }

/* Okta sign-in screen */
.signin { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.signin-card { width: 380px; max-width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 32px; display: flex; flex-direction: column; gap: 18px; text-align: center; align-items: center; }
.signin-card img { height: 44px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

@media (max-width: 1100px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .top-games { grid-template-columns: minmax(0, 1fr); }
  .side-games { grid-template-rows: none; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .side-game { grid-template-columns: minmax(0, 1fr); }
  .side-game .cover { aspect-ratio: 16 / 10; height: auto; }
  .detail-head { grid-template-columns: minmax(0, 1fr); }
  .cols-3-1 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .topbar-inner { padding: 0 16px; gap: 12px; }
  .nav { overflow-x: auto; flex: 1; }
  .top-search { display: none; }
  .nav a .lbl-long { display: none; }
  .user-chip .who { display: none; }
  .top-actions .btn-label { display: none; }
  main { padding: 20px 16px 64px; }
  .grid, .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .cols-2 { grid-template-columns: minmax(0, 1fr); }
  .wizard { grid-template-columns: minmax(0, 1fr); }
  .steps { position: static; flex-direction: row; overflow-x: auto; }
  .steps .lbl { display: none; }
  .choice-grid { grid-template-columns: minmax(0, 1fr); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .review { grid-template-columns: minmax(0, 1fr); }
  .video { grid-template-columns: minmax(0, 1fr); }
  .manage-row { grid-template-columns: 88px minmax(0, 1fr); }
  .manage-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .side-games { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .brand img { height: 26px; }
  .grid, .grid.three { grid-template-columns: minmax(0, 1fr); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .passport dl { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .passport dd { margin-bottom: 10px; }
  .hbar { grid-template-columns: 96px minmax(0, 1fr) 56px; }
}

/* Platform stats page */
.st-page { display: flex; flex-direction: column; }
.st-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.st-head-copy { max-width: 640px; }
.st-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lime); margin-bottom: 10px; }
.st-eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px var(--lime-tint); }
.st-eyebrow-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.st-eyebrow-row .st-eyebrow { margin-bottom: 0; }
.st-node { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--rule-strong); background: var(--surface); font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.st-head h1 { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
.st-head p { color: var(--muted); margin-top: 10px; font-size: 15px; }
.st-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.st-pills { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--rule); }
.st-pills button { height: 28px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font-family: var(--mono); font-size: 12px; font-weight: 600; white-space: nowrap; transition: background-color 120ms ease-out, color 120ms ease-out; }
.st-pills button:hover { color: var(--paper); }
.st-pills button.on { background: var(--lime); color: var(--on-lime); }
.tabs .st-pills.st-type { margin-left: auto; align-self: center; margin-bottom: 6px; flex: none; }
.tabs .st-pills.st-type button { height: 24px; padding: 0 12px; font-size: 11.5px; }
.st-export { height: 36px; border-radius: 999px; font-size: 13px; }
.st-export svg { color: var(--lime); }

.st-label { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.st-label svg { width: 13px; height: 13px; }
.st-big-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.st-big { font-size: clamp(44px, 5.4vw, 68px); font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
.st-mid { font-size: 40px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; }
.st-sub { margin-top: 6px; font-size: 13px; color: var(--muted); }
.st-delta { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--lime-tint); color: var(--lime); font-family: var(--mono); font-size: 12px; font-weight: 600; white-space: nowrap; }
.st-delta.down { background: rgba(242, 131, 107, 0.12); color: var(--bad); }
.st-delta.dark { background: var(--ink); color: var(--lime); }
.st-delta.dark.down { color: #FFB4A3; }

/* Hero row */
.st-hero { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.st-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.st-card-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); margin-bottom: 4px; }
.st-card-top svg { color: var(--lime); }
.st-live { background: var(--lime); border-color: var(--lime); color: var(--on-lime); gap: 0; }
.st-live .st-label, .st-live .st-sub { color: rgba(15, 16, 17, 0.68); }
.st-live-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.st-live .st-big-row { margin-top: 12px; }
.st-ring { position: relative; width: 84px; height: 84px; flex: none; }
.st-ring svg { width: 100%; height: 100%; display: block; }
.st-ring > div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.st-ring b { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.st-ring span { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; margin-top: 2px; }
.st-live-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 22px; padding: 14px 16px; border-radius: var(--r-md); background: rgba(15, 16, 17, 0.08); }
.st-live-metrics > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.st-live-metrics b { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; white-space: nowrap; }
.st-live-metrics small { font-size: 11.5px; color: rgba(15, 16, 17, 0.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-live-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 20px; flex-wrap: wrap; }
.st-live-note { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; color: rgba(15, 16, 17, 0.72); }
.st-live-note i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.st-live-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--ink); color: var(--lime); font-weight: 700; font-size: 14px; max-width: 100%; transition: background-color 120ms ease-out; }
.st-live-btn:hover { background: #24272A; }
.st-live-btn svg { width: 14px; height: 14px; flex: none; }

.st-area-wrap { position: relative; height: 84px; margin: 14px 0 6px; }
.st-area { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.st-area-end { position: absolute; right: 0; width: 9px; height: 9px; margin: -4.5px -4.5px 0 0; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px var(--lime-tint); }
.st-strip { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding: 12px 14px; border-radius: var(--r-md); background: var(--ink); border: 1px solid var(--rule); }
.st-strip > div { display: flex; flex-direction: column; gap: 3px; }
.st-strip b { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.st-strip .hl { color: var(--lime); }
.st-strip-label { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.st-strip-label svg { width: 14px; height: 14px; color: var(--lime); }
.st-brackets { margin: 18px 0 16px; }
.st-brackets-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
.st-split { height: 8px; }
.st-bracket-legend { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.st-bracket-legend b { color: var(--paper); font-weight: 600; }

/* Panels */
.st-panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 22px 24px; margin-top: 20px; min-width: 0; display: flex; flex-direction: column; }
.st-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.st-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.st-panel-head h2 { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.st-panel-head h2 svg { color: var(--lime); flex: none; }
.st-panel-head p { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.st-pill-tag { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(198, 244, 50, 0.4); background: var(--lime-tint); color: var(--lime); font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.st-pill-tag.blue { border-color: rgba(125, 178, 236, 0.4); background: rgba(125, 178, 236, 0.1); color: var(--info); }
.st-panel-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: auto; padding: 12px 16px; border-radius: var(--r-md); background: var(--ink); border: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; color: var(--muted); }
.st-panel-foot > span { display: inline-flex; align-items: center; gap: 8px; }
.st-panel-foot svg { width: 14px; height: 14px; color: var(--lime); }
.st-panel-foot b { color: var(--paper); font-weight: 600; }
.st-foot-hl { color: var(--lime); font-weight: 600; letter-spacing: 0.04em; }
.st-link { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; color: var(--paper); font-family: var(--mono); font-size: 12px; font-weight: 600; }
.st-link:hover { color: var(--lime); }
.st-link svg { width: 14px; height: 14px; color: currentColor; }
.st-panel .st-rated-grid + .st-panel-foot, .st-roles + .st-panel-foot, .st-contrib + .st-panel-foot { margin-top: 18px; }

/* Most rated */
.st-rated-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 4px; }
.st-rated-card { display: flex; flex-direction: column; gap: 18px; padding: 14px 16px; border-radius: var(--r-md); background: var(--ink); border: 1px solid var(--rule); transition: border-color 140ms ease-out, transform 140ms ease-out; }
.st-rated-card:hover { border-color: var(--rule-strong); transform: translateY(-2px); }
.st-rated-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.st-rated-top > div { display: flex; flex-direction: column; gap: 5px; min-width: 0; align-items: flex-start; }
.st-rated-top b { font-size: 14.5px; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-mood { display: inline-block; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--rule-strong); font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.st-mood.good { border-color: rgba(198, 244, 50, 0.35); background: var(--lime-tint); color: var(--lime); }
.st-thumb { width: 44px; height: 44px; aspect-ratio: auto; flex: none; border-radius: 8px; border: 1px solid var(--rule-strong); }
.st-rated-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.st-rated-foot > div { display: flex; flex-direction: column; gap: 2px; }
.st-rated-foot small { font-size: 12px; color: var(--muted); }
.st-rating { display: inline-flex; align-items: center; gap: 6px; color: var(--warn); }
.st-rating svg { width: 14px; height: 14px; fill: currentColor; }
.st-rating b { color: var(--paper); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.st-pos { align-items: flex-end; }
.st-pos b { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; color: var(--lime); line-height: 1.1; }
.st-panel-head h2 svg[stroke] { flex: none; }

/* Roles */
.st-roles { display: flex; flex-direction: column; gap: 16px; }
.st-role-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 44px; align-items: baseline; gap: 10px; margin-bottom: 8px; font-size: 14px; }
.st-role-row b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-abbr { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
.st-role-meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.st-role-pct { text-align: right; font-family: var(--mono); font-weight: 600; font-size: 13px; }
.st-track { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.st-track > div { height: 100%; border-radius: 3px; }

/* Contributors */
.st-contrib { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.st-contrib-card { display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: var(--r-md); background: var(--ink); border: 1px solid var(--rule); min-width: 0; }
.st-contrib-card.lead { border-color: rgba(198, 244, 50, 0.55); background: linear-gradient(180deg, rgba(198, 244, 50, 0.08), var(--ink)); }
.st-contrib-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.st-contrib-ic { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: rgba(125, 178, 236, 0.14); color: var(--info); }
.st-contrib-card.lead .st-contrib-ic { background: var(--lime-tint); color: var(--lime); }
.st-contrib-pct { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.st-contrib-card h3 { font-size: 15.5px; font-weight: 700; }
.st-contrib-card p { font-size: 12.5px; color: var(--muted); }
.st-contrib-foot { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.02em; }
.st-contrib-foot > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-contrib-foot .st-foot-hl { text-transform: uppercase; letter-spacing: 0.08em; }

/* Ranking table */
.st-sort { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.st-sort select { height: 32px; font-family: var(--sans); font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; background-color: var(--ink); }
.st-table th { padding: 10px 14px; }
.st-table td { padding: 12px 14px; }
.st-row.top { background: rgba(198, 244, 50, 0.04); }
.st-row.first { background: rgba(198, 244, 50, 0.1); }
.st-row.first:hover { background: rgba(198, 244, 50, 0.14); }
.st-rank-n { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted); }
.st-rank-n.top { border: 1.5px solid var(--lime); color: var(--lime); }
.st-row.first .st-rank-n { background: var(--lime); color: var(--on-lime); }
.st-game { display: flex; align-items: center; gap: 12px; }
.st-game b { display: block; font-size: 14.5px; font-weight: 700; }
.st-game small { display: block; margin-top: 2px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.st-game:hover b { color: var(--lime); }
.st-players { font-size: 16px; font-weight: 700; }
.st-share { display: flex; align-items: center; gap: 12px; min-width: 150px; font-family: var(--mono); font-size: 12px; color: var(--lime); font-weight: 600; }
.st-share-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; max-width: 160px; }
.st-share-bar i { display: block; height: 100%; border-radius: 3px; background: var(--lime); }
.st-comp { color: var(--lime); font-weight: 600; }
.st-status { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
.st-status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.st-status.up i { background: var(--lime); box-shadow: 0 0 0 3px var(--lime-tint); }
.st-status.down i { background: var(--bad); box-shadow: 0 0 0 3px rgba(242, 131, 107, 0.14); }
.st-status.new i { background: var(--info); box-shadow: 0 0 0 3px rgba(125, 178, 236, 0.14); }

@media (max-width: 1100px) {
  .st-hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .st-live { grid-column: 1 / -1; }
  .st-rated-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .st-two { grid-template-columns: minmax(0, 1fr); }
  .st-controls { align-items: flex-start; }
}
@media (max-width: 860px) {
  .st-head h1 { font-size: 28px; }
  .st-hero { grid-template-columns: minmax(0, 1fr); }
  .st-panel, .st-card { padding: 18px 16px; }
  .st-live-metrics { grid-template-columns: minmax(0, 1fr); }
  .st-role-row { grid-template-columns: 40px minmax(0, 1fr) 44px; }
  .st-role-meta { grid-column: 2 / -1; grid-row: 2; }
  .st-pills { max-width: 100%; overflow-x: auto; }
}
@media (max-width: 560px) {
  .st-rated-grid, .st-contrib { grid-template-columns: minmax(0, 1fr); }
}


/* ===== Motion layer: entrances, live accents, hover feedback ===== */
::selection { background: var(--lime); color: var(--on-lime); }
html { scrollbar-width: thin; scrollbar-color: var(--rule-strong) var(--ink); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 8px; border: 2px solid var(--ink); }
::-webkit-scrollbar-thumb:hover { background: #4A4F50; }

/* Entrance (classes are set by the motion script; nothing is hidden without it) */
.mo { opacity: 0; }
.mo-in { animation-duration: 0.7s; animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); animation-delay: var(--d, 0ms); animation-fill-mode: backwards; }
.mo-in.mo-up { animation-name: moUp; }
.mo-in.mo-sub { animation-name: moSub; animation-duration: 0.55s; }
.mo-in.mo-row { animation-name: moRow; animation-duration: 0.45s; }
.mo-in.mo-fade { animation-name: moFade; animation-duration: 0.5s; }
@keyframes moUp { from { opacity: 0; transform: translateY(18px); } }
@keyframes moSub { from { opacity: 0; transform: translateY(8px) scale(0.985); } }
@keyframes moRow { from { opacity: 0; transform: translateX(-10px); } }
@keyframes moFade { from { opacity: 0; } }

/* Live accents */
@keyframes pulseLime { 0% { box-shadow: 0 0 0 0 rgba(198, 244, 50, 0.55); } 70%, 100% { box-shadow: 0 0 0 8px rgba(198, 244, 50, 0); } }
@keyframes pulseInk { 0% { box-shadow: 0 0 0 0 rgba(15, 16, 17, 0.45); } 70%, 100% { box-shadow: 0 0 0 8px rgba(15, 16, 17, 0); } }
@keyframes pulseGood { 0% { box-shadow: 0 0 0 0 rgba(111, 207, 142, 0.55); } 70%, 100% { box-shadow: 0 0 0 7px rgba(111, 207, 142, 0); } }
.st-eyebrow i { animation: pulseLime 2.2s ease-out infinite; }
.st-live-note i { animation: pulseInk 2s ease-out infinite; }
.st-status.up i { animation: pulseLime 2.6s ease-out infinite; }
.menu-head .okta i { animation: pulseGood 2.4s ease-out infinite; }
.st-area-end { animation: pulseLime 2s ease-out infinite 1.4s, popDot 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) 1.1s backwards; }
@keyframes popDot { from { transform: scale(0); } }
@keyframes ringIn { from { stroke-dasharray: 0 213.6; } }
.st-ring circle:nth-of-type(2) { animation: ringIn 1.3s cubic-bezier(0.2, 0.7, 0.2, 1) 0.35s backwards; }
@keyframes wipe { from { clip-path: inset(-10px 100% -10px -10px); } to { clip-path: inset(-10px -10px -10px -10px); } }
.st-area { animation: wipe 1.3s cubic-bezier(0.4, 0, 0.2, 1) 0.4s backwards; }
.st-live { position: relative; overflow: hidden; isolation: isolate; }
.st-live::after { content: ''; position: absolute; top: -20%; bottom: -20%; left: -40%; width: 30%; z-index: -1; pointer-events: none; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.34), transparent); transform: skewX(-18deg) translateX(-100%); animation: sheen 7s ease-in-out 1.5s infinite; }
@keyframes sheen { 0%, 55% { transform: skewX(-18deg) translateX(-120%); } 100% { transform: skewX(-18deg) translateX(560%); } }
.cover-play .ring, .video-play .ring { position: relative; }
.cover-play .ring::after, .video-play .ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--lime); animation: ringPing 2.4s ease-out infinite; pointer-events: none; }
@keyframes ringPing { 0% { transform: scale(1); opacity: 0.7; } 80%, 100% { transform: scale(1.55); opacity: 0; } }

/* Hover and press feedback */
.btn { transition: background-color 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out, transform 120ms ease-out, box-shadow 220ms ease-out; }
.btn:hover { transform: translateY(-1px); }
.btn:active, .st-live-btn:active, .st-pills button:active, .seg button:active { transform: translateY(0) scale(0.97); }
.btn-primary:hover { box-shadow: 0 0 0 4px var(--lime-tint), 0 10px 26px -10px rgba(198, 244, 50, 0.55); }
.st-live-btn { transition: background-color 120ms ease-out, transform 120ms ease-out, box-shadow 220ms ease-out; }
.st-live-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -10px rgba(15, 16, 17, 0.7); }
.st-live-btn svg { transition: transform 200ms ease-out; }
.st-live-btn:hover svg { transform: scale(1.25); }
.st-pills button { transition: background-color 160ms ease-out, color 160ms ease-out, transform 120ms ease-out; }
.seg button { transition: background-color 120ms ease-out, color 120ms ease-out, transform 120ms ease-out; }
.tabs a { transition: color 140ms ease-out, border-bottom-color 200ms ease-out; }
.tabs a:not(.on):hover { border-bottom-color: var(--rule-strong); }
.card { transition: border-color 160ms ease-out, transform 200ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 240ms ease-out; }
.card:hover { box-shadow: 0 18px 34px -18px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(198, 244, 50, 0.12); }
.cover img, .cover svg { transition: transform 600ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.card:hover .cover img, .card:hover .cover svg, .side-game:hover .cover img, .side-game:hover .cover svg { transform: scale(1.06); }
.side-game { transition: border-color 160ms ease-out, transform 200ms ease-out, box-shadow 240ms ease-out; }
.side-game:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -16px rgba(0, 0, 0, 0.85); }
.st-card, .st-panel { transition: border-color 200ms ease-out, transform 200ms ease-out; }
.st-card:hover, .st-panel:hover { border-color: var(--rule-strong); }
.st-live:hover { border-color: var(--lime); }
.st-rated-card { transition: border-color 160ms ease-out, transform 200ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 240ms ease-out; }
.st-rated-card:hover { box-shadow: 0 14px 28px -16px rgba(0, 0, 0, 0.9); }
.st-contrib-card { transition: border-color 160ms ease-out, transform 200ms cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 240ms ease-out; }
.st-contrib-card:hover { transform: translateY(-3px); border-color: var(--rule-strong); box-shadow: 0 14px 28px -16px rgba(0, 0, 0, 0.9); }
.st-contrib-card.lead:hover { border-color: var(--lime); }
.st-card:not(.st-live):hover, .st-rated-card:hover, .st-contrib-card:not(.lead):hover, .card:hover {
  background-image: radial-gradient(360px circle at var(--mx, 50%) var(--my, 0%), rgba(198, 244, 50, 0.075), transparent 62%);
}
table.data tbody tr td:first-child { transition: box-shadow 160ms ease-out; }
table.data tbody tr.clickable:hover td:first-child { box-shadow: inset 3px 0 0 var(--lime); }
.st-game .st-thumb, .st-rated-top .st-thumb { transition: transform 240ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.st-row:hover .st-thumb, .st-rated-card:hover .st-thumb { transform: scale(1.08) rotate(-2deg); }
.st-share-bar i, .st-track > div, .hbar .fill { transition: filter 200ms ease-out; }
.st-row:hover .st-share-bar i { filter: brightness(1.25); }
.like { transition: color 140ms ease-out, border-color 140ms ease-out, transform 140ms ease-out; }
.like:active { transform: scale(0.9); }
.like.on svg { animation: likePop 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes likePop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }

/* Overlays */
.layer-enter { animation: layerFade 0.22s ease-out; }
.layer-enter > .drawer { animation: drawerIn 0.34s cubic-bezier(0.2, 0.8, 0.2, 1); }
.layer-enter > .player, .layer-enter .player:not(.inline-player) { animation: popScale 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes layerFade { from { opacity: 0; } }
@keyframes drawerIn { from { transform: translateX(40px); opacity: 0; } }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashString(text) {
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) {
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  // Relative weight per hour of the day for each shift pattern
  const HOUR_WEIGHTS = {
    day: [0, 0, 0, 0, 0, 0, 0, 0.2, 0.6, 1, 1.2, 1.6, 3, 3.2, 1.6, 1.4, 2, 2.2, 1.2, 0.8, 0.6, 0.4, 0.2, 0.1],
    night: [3.4, 3.6, 3, 2.6, 2, 1, 0.4, 0.2, 0, 0, 0, 0, 0, 0, 0, 0, 0.2, 0.4, 0.8, 1.2, 1.8, 2.4, 3, 3.2],
    mixed: [1, 1, 0.8, 0.6, 0.4, 0.2, 0.2, 0.4, 0.8, 1, 1.2, 1.4, 2.2, 2.2, 1.4, 1.4, 1.6, 1.6, 1.2, 1, 1, 1, 1, 1],
  };

  function pickWeighted(weights, r) {
    const total = weights.reduce((sum, w) => sum + w, 0);
    let x = r * total;
    for (let i = 0; i < weights.length; i++) {
      x -= weights[i];
      if (x <= 0) return i;
    }
    return weights.length - 1;
  }

  function generateSessions() {
    const sessions = [];
    let nextId = 1;
    GAMES.forEach((game) => {
      if (game.format === 'idea') return;
      const liveDays = Math.min(WINDOW_DAYS - 1, game.addedDaysAgo);
      USERS.forEach((user) => {
        const rng = mulberry32(hashString(game.id + ':' + user.id));
        let affinity = 1;
        if (user.role === 'Game Presenter' && game.type === 'arcade') affinity = 1.5;
        if ((user.role === 'Game Math' || user.role === 'Engineering') && game.type === 'rng') affinity = 1.25;
        if (user.id === game.authorId) affinity = 1.6;
        const chance = Math.min(0.95, game.popularity * user.activity * affinity * 0.85);
        if (rng() > chance) return;
        const count = 1 + Math.floor(rng() * game.popularity * user.activity * affinity * 18);
        for (let i = 0; i < count; i++) {
          // Newer games skew towards recent days, which makes them trend
          const daysAgo = Math.min(liveDays, Math.floor(Math.pow(rng(), 1.3) * (liveDays + 1)));
          const hour = pickWeighted(HOUR_WEIGHTS[user.shift], rng());
          const minutes = Math.max(0.5, Math.round(game.avgMinutes * (0.35 + rng() * 1.4) * 2) / 2);
          const session = { id: 's' + nextId++, gameId: game.id, userId: user.id, daysAgo, hour, minutes };
          if (game.type === 'rng' && game.roundsPerMinute > 0) {
            const rounds = Math.max(1, Math.round(minutes * game.roundsPerMinute));
            const stake = rounds * 10;
            const edge = game.rtp === null ? 0.97 : game.rtp;
            session.rounds = rounds;
            session.stake = stake;
            session.payout = Math.floor(stake * (edge + (rng() - 0.5) * 0.5));
          } else if (game.type === 'arcade') {
            session.score = Math.round(minutes * (180 + rng() * 520));
          }
          sessions.push(session);
        }
      });
    });
    return sessions;
  }

  // a catalog entry upgrades the mock game with the same id, any other entry becomes a new game.
  const CATALOG = Array.isArray(window.EVO_CATALOG) ? window.EVO_CATALOG : [];
  CATALOG.forEach((entry) => {
    const game = GAMES.find((g) => g.id === entry.id);
    if (game) {
      game.demo = { kind: 'bundled', src: entry.entryUrl };
      game.version = entry.version;
      game.core = entry.core || game.core;
      game.cover = entry.coverUrl;
      return;
    }
    GAMES.push({
      id: entry.id,
      title: entry.title,
      authorId: CURRENT_USER_ID,
      type: entry.core ? 'rng' : 'arcade',
      core: entry.core || null,
      format: 'demo',
      stage: 'prototype',
      addedDaysAgo: 0,
      updatedDaysAgo: 0,
      version: entry.version,
      cover: entry.coverUrl,
      demo: { kind: 'bundled', src: entry.entryUrl },
      popularity: 0.5,
      avgMinutes: 5,
      roundsPerMinute: 3,
      rtp: null,
      upvotes: 0,
      ratings: [0, 0, 0, 0, 0],
      tags: [entry.core || 'game'],
      tagline: entry.description,
      description: entry.description,
      passport: {
        kind: entry.core ? 'Mechanic' : 'Game',
        randomness: 'To be filled in',
        decisions: 'To be filled in',
        roundFormat: 'To be filled in',
        business: entry.core ? 'House-banked, demo credits' : 'None, internal game',
        embedding: 'To be decided',
        redFlags: 'Not reviewed yet',
      },

  window.EVO_DATA = {
    TODAY,

    SESSIONS: generateSessions(),

})();
