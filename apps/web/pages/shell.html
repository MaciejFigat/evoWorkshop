<script>
/*
 * Aggregations over EVO_DATA.SESSIONS. Every page computes its numbers here,
 * so a game page, the stats page and the gamers board always agree.
 */
(function () {
  'use strict';

  const D = window.EVO_DATA;
  const DAY_MS = 86400000;
  const TODAY_MS = Date.parse(D.TODAY + 'T12:00:00Z');
  const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function dateOf(daysAgo) {
    return new Date(TODAY_MS - daysAgo * DAY_MS);
  }

  function dateLabel(daysAgo) {
    const d = dateOf(daysAgo);
    return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate();
  }

  // Monday-first weekday index, 0..6
  function weekdayOf(daysAgo) {
    return (dateOf(daysAgo).getUTCDay() + 6) % 7;
  }

  function sessionsWhere(filter) {
    const f = filter || {};
    const typeOf = {};
    D.GAMES.forEach((g) => {
      typeOf[g.id] = g.type;
    });
    return D.SESSIONS.filter((s) => {
      if (f.days !== undefined && s.daysAgo >= f.days) return false;
      if (f.gameId !== undefined && s.gameId !== f.gameId) return false;
      if (f.userId !== undefined && s.userId !== f.userId) return false;
      if (f.type !== undefined && f.type !== 'all' && typeOf[s.gameId] !== f.type) return false;
      return true;
    });
  }

  function sum(list, key) {
    return list.reduce((total, item) => total + (item[key] || 0), 0);
  }

  function daily(sessions, days) {
    const values = new Array(days).fill(0);
    sessions.forEach((s) => {
      if (s.daysAgo < days) values[days - 1 - s.daysAgo] += 1;
    });
    const labels = values.map((_, i) => dateLabel(days - 1 - i));
    return { values, labels };
  }

  function heatmap(sessions) {
    const grid = WEEKDAYS.map(() => new Array(24).fill(0));
    sessions.forEach((s) => {
      grid[weekdayOf(s.daysAgo)][s.hour] += 1;
    });
    return grid;
  }

  function busiestCell(grid) {
    let best = { day: 0, hour: 0, value: -1 };
    grid.forEach((row, day) =>
      row.forEach((value, hour) => {
        if (value > best.value) best = { day, hour, value };
      }),
    );
    return { weekday: WEEKDAYS[best.day], hour: best.hour, value: best.value };
  }

  function returningShare(sessions) {
    const daysByUser = {};
    sessions.forEach((s) => {
      daysByUser[s.userId] = daysByUser[s.userId] || new Set();
      daysByUser[s.userId].add(s.daysAgo);
    });
    const users = Object.keys(daysByUser);
    if (users.length === 0) return 0;
    return users.filter((u) => daysByUser[u].size > 1).length / users.length;
  }

  function byKey(sessions, key) {
    const groups = {};
    sessions.forEach((s) => {
      const k = s[key];
      groups[k] = groups[k] || { key: k, sessions: 0, minutes: 0, list: [] };
      groups[k].sessions += 1;
      groups[k].minutes += s.minutes;
      groups[k].list.push(s);
    });
    return Object.values(groups);
  }

  function lengthHistogram(sessions) {
    const edges = [2, 4, 6, 8, 10, 15, Infinity];
    const labels = ['<2', '2–4', '4–6', '6–8', '8–10', '10–15', '15+'];
    const counts = new Array(edges.length).fill(0);
    sessions.forEach((s) => {
      const i = edges.findIndex((edge) => s.minutes < edge);
      counts[i] += 1;
    });
    return { labels, counts };
  }

  function summarize(sessions, days) {
    const players = new Set(sessions.map((s) => s.userId));
    const minutes = sum(sessions, 'minutes');
    const stake = sum(sessions, 'stake');
    const payout = sum(sessions, 'payout');
    return {
      sessions: sessions.length,
      players: players.size,
      minutes,
      avgMinutes: sessions.length ? minutes / sessions.length : 0,
      returning: returningShare(sessions),
      rounds: sum(sessions, 'rounds'),
      stake,
      payout,
      observedRtp: stake > 0 ? payout / stake : null,
      bestScore: sessions.reduce((best, s) => Math.max(best, s.score || 0), 0),
      daily: daily(sessions, days),
      heatmap: heatmap(sessions),
    };
  }

  function gameStats(gameId, days) {
    const sessions = sessionsWhere({ gameId, days });
    const summary = summarize(sessions, days);
    summary.topPlayers = byKey(sessions, 'userId')
      .map((g) => ({ userId: g.key, sessions: g.sessions, minutes: g.minutes, best: g.list.reduce((b, s) => Math.max(b, s.score || 0), 0) }))
      .sort((a, b) => b.minutes - a.minutes);
    summary.lengths = lengthHistogram(sessions);
    return summary;
  }

  function platformStats(days, type) {
    const sessions = sessionsWhere({ days, type });
    const summary = summarize(sessions, days);
    const roleOf = {};
    D.USERS.forEach((u) => {
      roleOf[u.id] = u.role;
    });
    summary.byGame = byKey(sessions, 'gameId').sort((a, b) => b.minutes - a.minutes);
    const roles = {};
    sessions.forEach((s) => {
      const role = roleOf[s.userId];
      roles[role] = (roles[role] || 0) + s.minutes;
    });
    summary.byRole = Object.keys(roles)
      .map((role) => ({ role, minutes: roles[role] }))
      .sort((a, b) => b.minutes - a.minutes);
    const perGamer = byKey(sessions, 'userId').map((g) => g.minutes);
    const edges = [15, 30, 60, 120, Infinity];
    const labels = ['<15 min', '15–30 min', '30–60 min', '1–2 h', '2 h+'];
    const counts = new Array(edges.length).fill(0);
    perGamer.forEach((m) => {
      counts[edges.findIndex((edge) => m < edge)] += 1;
    });
    summary.gamerTime = { labels, counts };
    summary.avgPerGamer = perGamer.length ? perGamer.reduce((a, b) => a + b, 0) / perGamer.length : 0;
    return summary;
  }

  function userStats(userId, days) {
    const sessions = sessionsWhere({ userId, days });
    const games = byKey(sessions, 'gameId').sort((a, b) => b.minutes - a.minutes);
    const created = D.GAMES.filter((g) => g.authorId === userId);
    const createdIds = new Set(created.map((g) => g.id));
    const received = sessionsWhere({ days }).filter((s) => createdIds.has(s.gameId) && s.userId !== userId);
    return {
      sessions: sessions.length,
      minutes: sum(sessions, 'minutes'),
      gamesPlayed: games.length,
      favourite: games.length ? games[0].key : null,
      perGame: games,
      created: created.length,
      playsReceived: received.length,
      playersReceived: new Set(received.map((s) => s.userId)).size,
      heatmap: heatmap(sessions),
    };
  }

  function trend(gameId) {
    const last = sessionsWhere({ gameId, days: 7 }).length;
    const prev = sessionsWhere({ gameId, days: 14 }).length - last;
    return { last, prev, delta: prev > 0 ? (last - prev) / prev : null };
  }

  function formatMinutes(minutes) {
    if (minutes < 60) return Math.round(minutes) + ' min';
    const h = Math.floor(minutes / 60);
    const m = Math.round(minutes - h * 60);
    return m === 0 ? h + ' h' : h + ' h ' + m + ' min';
  }

  function formatHours(minutes) {
    return (minutes / 60).toFixed(minutes >= 600 ? 0 : 1) + ' h';
  }

  window.EVO_STATS = {
    WEEKDAYS,
    dateLabel,
    sessionsWhere,
    gameStats,
    platformStats,
    userStats,
    trend,
    busiestCell,
    formatMinutes,
    formatHours,
  };
})();

</script>
<script>
/*
 * Hand-drawn SVG charts. Pages emit placeholders with EVO_CHARTS.slot(kind, config);
 * mountAll() measures each placeholder and draws it at its real pixel width,
 * so text in charts never scales with the viewport.
 */
(function () {
  'use strict';

  const LIME = '#C6F432';
  const GRID = '#2B2E2F';
  const AXIS_TEXT = '#A6AAA0';
  const SURFACE = '#17191A';
  // Sequential ramp for magnitude: one hue, dark to bright on the dark surface
  const RAMP = ['#2A3315', '#3E5117', '#5C7A1B', '#8AB223', '#C6F432'];
  const EMPTY_CELL = '#1F2223';

  const configs = new Map();
  let nextId = 1;

  function esc(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }

  function slot(kind, config) {
    const id = 'chart-' + nextId++;
    configs.set(id, { kind, config });
    return '<div class="chart chart-' + kind + '" data-chart-id="' + id + '"></div>';
  }

  function niceStep(raw) {
    if (raw <= 0) return 1;
    const power = Math.pow(10, Math.floor(Math.log10(raw)));
    const unit = raw / power;
    const nice = unit <= 1 ? 1 : unit <= 2 ? 2 : unit <= 5 ? 5 : 10;
    return nice * power;
  }

  function formatTick(v) {
    return v >= 1000 ? (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'k' : String(Math.round(v));
  }

  const tooltip = (() => {
    const el = document.createElement('div');
    el.className = 'chart-tooltip';
    el.hidden = true;
    document.body.appendChild(el);
    return {
      show(html, x, y) {
        el.innerHTML = html;
        el.hidden = false;
        const box = el.getBoundingClientRect();
        let left = x + 14;
        if (left + box.width > window.innerWidth - 8) left = x - box.width - 14;
        el.style.left = Math.max(8, left) + 'px';
        el.style.top = Math.max(8, y - box.height - 10) + 'px';
      },
      hide() {
        el.hidden = true;
      },
    };
  })();

  function area(el, cfg) {
    const values = cfg.values;
    const labels = cfg.labels;
    const W = Math.max(240, el.clientWidth);
    const H = cfg.height || 200;
    const m = { l: 40, r: 16, t: 16, b: 26 };
    const pw = W - m.l - m.r;
    const ph = H - m.t - m.b;
    const max = Math.max(1, ...values);
    const step = niceStep(max / 4);
    const top = Math.ceil(max / step) * step;
    const x = (i) => m.l + (values.length === 1 ? pw / 2 : (i / (values.length - 1)) * pw);
    const y = (v) => m.t + ph - (v / top) * ph;
    const gid = 'grad-' + el.dataset.chartId;

    let grid = '';
    for (let v = 0; v <= top; v += step) {
      grid += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + GRID + '" stroke-width="1"/>';
      grid += '<text x="' + (m.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" class="axis">' + formatTick(v) + '</text>';
    }
    const every = Math.max(1, Math.ceil(values.length / 6));
    let xLabels = '';
    labels.forEach((label, i) => {
      if (i % every === 0 || i === labels.length - 1) {
        if (i !== labels.length - 1 && labels.length - 1 - i < every / 2) return;
        const anchor = i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle';
        xLabels += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '" class="axis">' + esc(label) + '</text>';
      }
    });
    const line = values.map((v, i) => (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const fill = line + ' L' + x(values.length - 1).toFixed(1) + ' ' + y(0) + ' L' + x(0).toFixed(1) + ' ' + y(0) + ' Z';
    const last = values.length - 1;
    const endLabel = cfg.unit ? values[last] + ' ' + cfg.unit : values[last];

    el.innerHTML =
      '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(cfg.label || 'Line chart') + '">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + LIME + '" stop-opacity="0.18"/><stop offset="1" stop-color="' + LIME + '" stop-opacity="0"/></linearGradient></defs>' +
      grid + xLabels +
      '<path d="' + fill + '" fill="url(#' + gid + ')"/>' +
      '<path d="' + line + '" fill="none" stroke="' + LIME + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + x(last) + '" cy="' + y(values[last]) + '" r="4.5" fill="' + LIME + '" stroke="' + SURFACE + '" stroke-width="2"/>' +
      '<text x="' + (x(last) - 8) + '" y="' + (y(values[last]) - 10) + '" text-anchor="end" class="end-label">' + esc(endLabel) + '</text>' +
      '<line class="cross" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ph) + '" stroke="' + AXIS_TEXT + '" stroke-width="1" visibility="hidden"/>' +
      '<circle class="cross-dot" r="4.5" fill="' + LIME + '" stroke="' + SURFACE + '" stroke-width="2" visibility="hidden"/>' +
      '<rect class="hit" x="' + m.l + '" y="' + m.t + '" width="' + pw + '" height="' + ph + '" fill="transparent"/>' +
      '</svg>';

    const svg = el.querySelector('svg');
    const cross = svg.querySelector('.cross');
    const dot = svg.querySelector('.cross-dot');
    const hit = svg.querySelector('.hit');
    hit.addEventListener('mousemove', (e) => {
      const rect = svg.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const i = Math.max(0, Math.min(values.length - 1, Math.round(((px - m.l) / pw) * (values.length - 1))));
      cross.setAttribute('x1', x(i));
      cross.setAttribute('x2', x(i));
      cross.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', x(i));
      dot.setAttribute('cy', y(values[i]));
      dot.setAttribute('visibility', 'visible');
      tooltip.show('<b>' + esc(labels[i]) + '</b><span>' + values[i] + ' ' + esc(cfg.unit || '') + '</span>', rect.left + x(i), rect.top + y(values[i]));
    });
    hit.addEventListener('mouseleave', () => {
      cross.setAttribute('visibility', 'hidden');
      dot.setAttribute('visibility', 'hidden');
      tooltip.hide();
    });
  }

  function heat(el, cfg) {
    const grid = cfg.grid;
    const rows = cfg.rowLabels;
    const W = Math.max(280, el.clientWidth);
    const lw = 40;
    const gap = 2;
    const cw = (W - lw) / 24;
    const ch = Math.max(14, Math.min(22, cw * 0.9));
    const H = rows.length * ch + 24;
    const max = Math.max(1, ...grid.map((r) => Math.max(...r)));
    const colorOf = (v) => (v === 0 ? EMPTY_CELL : RAMP[Math.min(RAMP.length - 1, Math.floor((v / max) * RAMP.length - 1e-9))]);
    let cells = '';
    grid.forEach((row, r) => {
      cells += '<text x="' + (lw - 8) + '" y="' + (r * ch + ch / 2 + 4) + '" text-anchor="end" class="axis">' + rows[r] + '</text>';
      row.forEach((v, c) => {
        cells +=
          '<rect class="cell" data-r="' + r + '" data-c="' + c + '" x="' + (lw + c * cw + gap / 2).toFixed(1) + '" y="' + (r * ch + gap / 2).toFixed(1) +
          '" width="' + (cw - gap).toFixed(1) + '" height="' + (ch - gap).toFixed(1) + '" rx="2" fill="' + colorOf(v) + '"/>';
      });
    });
    let hours = '';
    for (let h = 0; h < 24; h += 3) {
      hours += '<text x="' + (lw + h * cw) + '" y="' + (H - 6) + '" class="axis">' + String(h).padStart(2, '0') + ':00</text>';
    }
    const legend =
      '<div class="heat-legend"><span>Fewer</span>' +
      RAMP.map((c) => '<i style="background:' + c + '"></i>').join('') +
      '<span>More</span><span class="heat-legend-max">Peak cell: ' + max + ' ' + esc(cfg.unit || 'sessions') + '</span></div>';
    el.innerHTML = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(cfg.label || 'Heatmap') + '">' + cells + hours + '</svg>' + legend;
    el.querySelectorAll('.cell').forEach((cell) => {
      cell.addEventListener('mouseenter', (e) => {
        const r = Number(cell.dataset.r);
        const c = Number(cell.dataset.c);
        const v = grid[r][c];
        const span = String(c).padStart(2, '0') + ':00–' + String((c + 1) % 24).padStart(2, '0') + ':00';
        tooltip.show('<b>' + rows[r] + ' ' + span + '</b><span>' + v + ' ' + esc(cfg.unit || 'sessions') + '</span>', e.clientX, e.clientY);
      });
      cell.addEventListener('mouseleave', tooltip.hide);
    });
  }

  function histogram(el, cfg) {
    const counts = cfg.counts;
    const W = Math.max(240, el.clientWidth);
    const H = cfg.height || 180;
    const m = { l: 32, r: 8, t: 20, b: 26 };
    const pw = W - m.l - m.r;
    const ph = H - m.t - m.b;
    const max = Math.max(1, ...counts);
    const step = niceStep(max / 3);
    const top = Math.ceil(max / step) * step;
    const bw = pw / counts.length;
    const y = (v) => m.t + ph - (v / top) * ph;
    let out = '';
    for (let v = 0; v <= top; v += step) {
      out += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + GRID + '"/>';
      out += '<text x="' + (m.l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" class="axis">' + formatTick(v) + '</text>';
    }
    const maxIndex = counts.indexOf(Math.max(...counts));
    counts.forEach((v, i) => {
      const x = m.l + i * bw + 2;
      const h = y(0) - y(v);
      if (v > 0) {
        out += '<path class="bar" data-i="' + i + '" d="M' + x + ' ' + y(0) + ' V' + (y(v) + Math.min(4, h)) + ' Q' + x + ' ' + y(v) + ' ' + (x + Math.min(4, h)) + ' ' + y(v) +
          ' H' + (x + bw - 4 - Math.min(4, h)) + ' Q' + (x + bw - 4) + ' ' + y(v) + ' ' + (x + bw - 4) + ' ' + (y(v) + Math.min(4, h)) + ' V' + y(0) + ' Z" fill="' + LIME + '"/>';
      }
      out += '<rect class="bar-hit" data-i="' + i + '" x="' + (m.l + i * bw) + '" y="' + m.t + '" width="' + bw + '" height="' + ph + '" fill="transparent"/>';
      out += '<text x="' + (m.l + i * bw + bw / 2 - 1) + '" y="' + (H - 6) + '" text-anchor="middle" class="axis">' + esc(cfg.labels[i]) + '</text>';
      if (i === maxIndex && v > 0) {
        out += '<text x="' + (m.l + i * bw + bw / 2 - 1) + '" y="' + (y(v) - 6) + '" text-anchor="middle" class="end-label">' + v + '</text>';
      }
    });
    el.innerHTML = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(cfg.label || 'Histogram') + '">' + out + '</svg>';
    el.querySelectorAll('.bar-hit').forEach((hit) => {
      hit.addEventListener('mouseenter', (e) => {
        const i = Number(hit.dataset.i);
        tooltip.show('<b>' + esc(cfg.labels[i]) + ' ' + esc(cfg.labelUnit || '') + '</b><span>' + counts[i] + ' ' + esc(cfg.unit || '') + '</span>', e.clientX, e.clientY);
      });
      hit.addEventListener('mouseleave', tooltip.hide);
    });
  }

  function sparkline(values, width, height) {
    const w = width || 96;
    const h = height || 28;
    const max = Math.max(1, ...values);
    const x = (i) => 2 + (i / Math.max(1, values.length - 1)) * (w - 6);
    const y = (v) => h - 3 - (v / max) * (h - 6);
    const d = values.map((v, i) => (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const last = values.length - 1;
    return (
      '<svg class="spark" width="' + w + '" height="' + h + '" aria-hidden="true"><path d="' + d + '" fill="none" stroke="' + AXIS_TEXT + '" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<circle cx="' + x(last) + '" cy="' + y(values[last]) + '" r="2.5" fill="' + LIME + '"/></svg>'
    );
  }

  function mountAll(root) {
    (root || document).querySelectorAll('[data-chart-id]').forEach((el) => {
      const entry = configs.get(el.dataset.chartId);
      if (!entry) return;
      if (entry.kind === 'area') area(el, entry.config);
      if (entry.kind === 'heat') heat(el, entry.config);
      if (entry.kind === 'hist') histogram(el, entry.config);
    });
  }

  function reset() {
    configs.clear();
    tooltip.hide();
  }

  window.EVO_CHARTS = { slot, mountAll, reset, sparkline, hideTooltip: () => tooltip.hide() };
})();

</script>
<script>
/*
 * Wireframe covers for games that have no art yet: rectangles and numbers,
 * as the repo asks for before any art ("wireframe facade first").
 */
(function () {
  'use strict';

  const BG = '#17191A';
  const LINE = '#3A3E3F';
  const LIME = '#C6F432';
  const PAPER = '#F2F3EE';
  const MUTED = '#A6AAA0';
  const MONO = "font-family=\"'IBM Plex Mono', ui-monospace, monospace\"";

  function frame(inner) {
    return (
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<rect width="320" height="200" fill="' + BG + '"/>' +
      '<g stroke="' + LINE + '" stroke-width="1">' +
      [40, 80, 120, 160].map((y) => '<line x1="0" x2="320" y1="' + y + '" y2="' + y + '" opacity="0.35"/>').join('') +
      '</g>' + inner + '</svg>'
    );
  }

  const motifs = {
    ladder(title) {
      const pts = [];
      for (let i = 0; i <= 20; i++) {
        const t = i / 20;
        pts.push((30 + t * 230).toFixed(1) + ',' + (176 - Math.pow(t, 2.2) * 112).toFixed(1));
      }
      return (
        '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + LIME + '" stroke-width="3" stroke-linecap="round"/>' +
        '<circle cx="260" cy="64" r="7" fill="none" stroke="' + PAPER + '" stroke-width="2"/>' +
        '<path d="M252 56l16 16M268 56l-16 16" stroke="' + PAPER + '" stroke-width="2"/>' +
        '<text x="30" y="84" fill="' + PAPER + '" font-size="34" font-weight="700" ' + MONO + '>2.41×</text>' +
        '<text x="30" y="104" fill="' + MUTED + '" font-size="11" ' + MONO + '>' + title + '</text>'
      );
    },
    cascade() {
      let pegs = '';
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c <= r; c++) {
          pegs += '<circle cx="' + (160 - r * 16 + c * 32) + '" cy="' + (30 + r * 22) + '" r="3" fill="' + MUTED + '"/>';
        }
      }
      const slots = ['9×', '2×', '0.5×', '0.3×', '0.5×', '2×', '9×'];
      const slotRow = slots
        .map((s, i) => '<rect x="' + (52 + i * 31) + '" y="166" width="27" height="20" rx="3" fill="' + (i === 1 ? LIME : 'none') + '" stroke="' + (i === 1 ? LIME : LINE) + '"/>' +
          '<text x="' + (65.5 + i * 31) + '" y="180" text-anchor="middle" font-size="9" fill="' + (i === 1 ? BG : MUTED) + '" ' + MONO + '>' + s + '</text>')
        .join('');
      return pegs + '<circle cx="128" cy="96" r="6" fill="' + LIME + '"/>' + '<path d="M160 22 L144 52 L128 96" fill="none" stroke="' + LIME + '" stroke-width="1.5" stroke-dasharray="2 4"/>' + slotRow;
    },
    pick() {
      const card = (x, y, raised) =>
        '<rect x="' + x + '" y="' + y + '" width="64" height="96" rx="6" fill="' + (raised ? '#1F2223' : 'none') + '" stroke="' + (raised ? LIME : LINE) + '" stroke-width="2"/>' +
        '<text x="' + (x + 32) + '" y="' + (y + 58) + '" text-anchor="middle" font-size="28" font-weight="700" fill="' + (raised ? LIME : MUTED) + '" ' + MONO + '>?</text>';
      return card(72, 58, false) + card(128, 44, true) + card(184, 58, false);
    },
    race() {
      let lanes = '';
      const pos = [210, 168, 236, 140, 190, 118];
      pos.forEach((x, i) => {
        const y = 52 + i * 23;
        lanes += '<line x1="30" x2="270" y1="' + y + '" y2="' + y + '" stroke="' + LINE + '"/>';
        lanes += '<circle cx="' + x + '" cy="' + y + '" r="8" fill="' + (i === 2 ? LIME : 'none') + '" stroke="' + (i === 2 ? LIME : PAPER) + '" stroke-width="2"/>';
        lanes += '<text x="22" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="' + MUTED + '" ' + MONO + '>' + (i + 1) + '</text>';
      });
      return lanes + '<line x1="280" x2="280" y1="40" y2="184" stroke="' + PAPER + '" stroke-width="3" stroke-dasharray="6 6"/>';
    },
    flap() {
      const pipe = (x, gapY) =>
        '<rect x="' + x + '" y="0" width="34" height="' + gapY + '" fill="none" stroke="' + LINE + '" stroke-width="2"/>' +
        '<rect x="' + x + '" y="' + (gapY + 64) + '" width="34" height="' + (200 - gapY - 64) + '" fill="none" stroke="' + LINE + '" stroke-width="2"/>';
      return (
        pipe(120, 52) + pipe(230, 90) +
        '<path d="M40 130 Q 80 70 112 96 T 160 88" fill="none" stroke="' + MUTED + '" stroke-width="1.5" stroke-dasharray="3 5"/>' +
        '<rect x="152" y="78" width="20" height="20" rx="3" fill="' + LIME + '"/>' +
        '<text x="292" y="188" text-anchor="end" font-size="22" font-weight="700" fill="' + PAPER + '" ' + MONO + '>042</text>'
      );
    },
    snake() {
      const cells = [[5, 9], [6, 9], [7, 9], [8, 9], [8, 8], [8, 7], [9, 7], [10, 7], [11, 7], [11, 6]];
      const size = 14;
      const ox = 48;
      const oy = 2;
      let out = '<rect x="' + ox + '" y="' + (oy + 14) + '" width="224" height="168" fill="none" stroke="' + LINE + '" stroke-width="2"/>';
      cells.forEach(([c, r], i) => {
        out += '<rect x="' + (ox + c * size + 1) + '" y="' + (oy + r * size + 1) + '" width="' + (size - 2) + '" height="' + (size - 2) + '" rx="2" fill="' + (i === cells.length - 1 ? LIME : PAPER) + '"/>';
      });
      return out + '<circle cx="' + (ox + 14.5 * size) + '" cy="' + (oy + 4.5 * size) + '" r="6" fill="none" stroke="' + LIME + '" stroke-width="2.5"/>';
    },
    idea(title) {
      return (
        '<rect x="40" y="40" width="240" height="120" rx="8" fill="none" stroke="' + LINE + '" stroke-width="2" stroke-dasharray="6 6"/>' +
        '<text x="160" y="104" text-anchor="middle" font-size="16" fill="' + MUTED + '" ' + MONO + '>' + title + '</text>'
      );
    },
  };

  const MOTIF_BY_GAME = {
    'skyline-crash': 'ladder',
    'casino-runner': 'ladder',
    'plinko-balls': 'cascade',
    'monster-cards': 'pick',
    'marble-derby': 'race',
    'flap-dash': 'flap',
    'studio-snake': 'snake',
  };

  const MOTIF_BY_CORE = { ladder: 'ladder', mines: 'idea', pick: 'pick', draw: 'idea', cascade: 'cascade', race: 'race', board: 'idea', collect: 'idea' };

  function escapeXml(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' })[c]);
  }

  function coverFor(game) {
    const key = MOTIF_BY_GAME[game.id] || (game.core && MOTIF_BY_CORE[game.core]) || 'idea';
    return frame(motifs[key](escapeXml(game.title)));
  }

  window.EVO_COVERS = { coverFor };
})();

  function avatar(user, size) {
    const cls = 'avatar' + (size ? ' ' + size : '') + (user.id === state.currentUserId ? ' me' : '');
    const initials = user.name.split(' ').map((part) => part.slice(0, 1)).join('').slice(0, 2);

  function upvotesOf(game) {
    return game.upvotes + (state.upvoted[game.id] ? 1 : 0);
  }

  function ratingOf(game) {
    const counts = game.ratings.slice();
    const mine = state.ratings[game.id];
    if (mine) counts[mine - 1] += 1;
    const n = counts.reduce((a, b) => a + b, 0);
    const total = counts.reduce((a, c, i) => a + c * (i + 1), 0);
    return { avg: n ? total / n : 0, count: n };
  }

  function commentsOf(gameId) {
    const now = Date.now();
    const seeded = D.COMMENTS.filter((c) => c.gameId === gameId);
    const local = state.comments.filter((c) => c.gameId === gameId).map((c) => Object.assign({}, c, { hoursAgo: (now - c.createdAt) / 3600000 }));
    return seeded.concat(local).sort((a, b) => a.hoursAgo - b.hoursAgo);
  }

  function commentCountBy(userId) {
    return D.COMMENTS.filter((c) => c.userId === userId).length + state.comments.filter((c) => c.userId === userId).length;
  }

  function votesCastBy(user) {
    const own = user.id === state.currentUserId ? Object.keys(state.upvoted).filter((k) => state.upvoted[k]).length : 0;
    return Math.round(user.activity * 22) + own;
  }

  function ago(hours) {
    if (hours < 1) return 'just now';
    if (hours < 24) return Math.round(hours) + ' h ago';
    const days = Math.round(hours / 24);
    return days === 1 ? 'yesterday' : days + ' days ago';
  }

  function daysAgoText(days) {
    if (days === 0) return 'today';

  const memo = new Map();

  function slugify(text) {
    return text.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'game';
  }

  function markdown(src) {
    const lines = esc(src || '').split('\n');
    let html = '';
    let list = false;
    let code = null;
    const inline = (t) => t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    const closeList = () => {
      if (list) {
        html += '</ul>';
        list = false;
      }
    };
    lines.forEach((line) => {
      if (line.startsWith('```')) {
        if (code === null) {
          closeList();
          code = [];
        } else {
          html += '<pre><code>' + code.join('\n') + '</code></pre>';
          code = null;
        }
        return;
      }
      if (code !== null) {
        code.push(line);
        return;
      }
      if (line.startsWith('## ')) {
        closeList();
        html += '<h2>' + inline(line.slice(3)) + '</h2>';
      } else if (line.startsWith('# ')) {
        closeList();
        html += '<h1>' + inline(line.slice(2)) + '</h1>';
      } else if (line.startsWith('- ')) {
        if (!list) {
          html += '<ul>';
          list = true;
        }
        html += '<li>' + inline(line.slice(2)) + '</li>';
      } else if (line.trim() === '') {
        closeList();
      } else {
        closeList();
        html += '<p>' + inline(line) + '</p>';
      }
    });
    closeList();
    if (code !== null) html += '<pre><code>' + code.join('\n') + '</code></pre>';
    return html;
  }

  function searchMatches() {
    const q = ui.search.q.trim().toLowerCase();
    if (!q) return { games: [], people: [] };
    const games = visibleGames().filter((g) => (g.title + ' ' + g.tagline + ' ' + g.tags.join(' ') + ' ' + userById(g.authorId).name).toLowerCase().includes(q)).slice(0, 6);
    const people = D.USERS.filter((u) => (u.name + ' ' + u.role).toLowerCase().includes(q)).slice(0, 4);
    return { games, people };
  }

  function searchResults() {
    const { games, people } = searchMatches();
    if (!ui.search.q.trim()) return '';
    if (!games.length && !people.length) return '<p class="sr-empty">No games or people match \u201c' + esc(ui.search.q.trim()) + '\u201d.</p>';
    let i = 0;
    const item = (inner, attrs) => {
      const on = i === ui.search.index;
      const html = '<' + attrs.tag + ' class="sr-item' + (on ? ' on' : '') + '" role="option" id="sr-' + i + '" aria-selected="' + on + '" data-sr="' + i + '" ' + attrs.rest + '>' + inner + '</' + attrs.tag + '>';
      i += 1;
      return html;
    };
    let html = '';
    if (games.length) {
      html += '<div class="sr-group">Games</div>' + games.map((g) => item(
        '<span class="sr-thumb cover">' + coverHtml(g) + '</span><span class="sr-text"><b>' + esc(g.title) + '</b><span>' + TYPE_LABEL[g.type] + ' · ' + FORMAT_LABEL[g.format] + ' · ' + esc(userById(g.authorId).name) + '</span></span>',

        { tag: 'button', rest: 'type="button" data-action="open-user" data-id="' + u.id + '"' })).join('');
    }
    return html;
  }

  const TRENDING_SIDE = ['alchemy-brawl', 'warsaw-streets', 'relic-rush'];

  function lobbyPage() {
    const games = visibleGames();
    const playable = games.filter((g) => g.format !== 'idea');
    const byWeek = playable.slice().sort((a, b) => gameStats(b.id, 7).sessions - gameStats(a.id, 7).sessions);
    const featured = byWeek[0];
    // The side column of Trending is pinned for the demo; a pinned game missing from the catalog gives its slot back to the weekly ranking.
    const pinned = TRENDING_SIDE.map((id) => playable.find((g) => g.id === id)).filter((g) => g && g !== featured);
    const side = pinned.concat(byWeek.filter((g) => g !== featured && !pinned.includes(g))).slice(0, 3);
    const shown = new Set([featured, ...side].filter(Boolean).map((g) => g.id));
    const latest = games.filter((g) => !shown.has(g.id)).sort((a, b) => a.addedDaysAgo - b.addedDaysAgo).slice(0, 4);
    latest.forEach((g) => shown.add(g.id));
    const rated = playable.filter((g) => !shown.has(g.id)).sort((a, b) => ratingOf(b).avg - ratingOf(a).avg).slice(0, 4);
    const week = S.platformStats(7, 'all');
    const ideas = games.filter((g) => g.format === 'idea').sort((a, b) => upvotesOf(b) - upvotesOf(a));
    const gamers = D.USERS.map((u) => ({ u, s: S.userStats(u.id, 7) })).filter((x) => x.s.sessions > 0).sort((a, b) => b.s.minutes - a.s.minutes).slice(0, 5);
    const fStats = featured ? gameStats(featured.id, 7) : null;

    const firstName = me().name.split(' ')[0];
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const prevWeek = S.sessionsWhere({ days: 14 }).filter((s) => s.daysAgo >= 7);
    const prevPlayers = new Set(prevWeek.map((s) => s.userId)).size;
    const prevMinutes = prevWeek.reduce((a, s) => a + s.minutes, 0);
    const makers = new Set(games.map((g) => g.authorId)).size;
    const counts = { arcade: playable.filter((g) => g.type === 'arcade').length, rng: playable.filter((g) => g.type === 'rng').length };
    const seen = new Set();
    const jump = [];
    S.sessionsWhere({ userId: state.currentUserId }).slice().sort((x, y) => x.daysAgo - y.daysAgo || (y.hour || 0) - (x.hour || 0)).forEach((s) => {
      if (seen.has(s.gameId)) return;
      seen.add(s.gameId);
      const g = playable.find((x) => x.id === s.gameId);
      if (g) jump.push({ g, s });
    });
    const dChip = (x) => (typeof deltaChip === 'function' ? deltaChip(x) : '');
    const lhStat = (ic, value, label, delta) => '<div class="lh-stat"><span class="lh-ic">' + icon(ic) + '</span><div><b class="num">' + value + '</b><span>' + label + '</span></div>' + (delta || '') + '</div>';
    const head = (ic, title, link) => '<div class="section-head"><h2><span class="sec-ic">' + icon(ic) + '</span>' + title + '</h2>' + (link || '') + '</div>';
    const qchip = (href, ic, label, n) => '<a class="qchip" href="' + href + '">' + icon(ic) + '<span>' + label + '</span>' + (n === undefined ? '' : '<i class="num">' + n + '</i>') + '</a>';

    return (
      '<section class="lobby-hero" aria-label="Welcome">' +
      '<div class="lh-copy"><span class="lh-mark"><img src="' + BRAND_MARK + '" alt=""></span><div>' +
      '<span class="label">' + greet + '</span>' +
      '<h1>Hi ' + esc(firstName) + ', ready for a round?</h1>' +
      '<p>' + playable.length + ' playable demos from ' + makers + ' colleagues. ' + fmt(week.sessions) + ' sessions played this week.</p>' +
      '<div class="lh-actions">' + (featured ? '<button type="button" class="btn btn-primary btn-lg" data-action="play" data-id="' + featured.id + '">' + PLAY + 'Play ' + esc(featured.title) + '</button>' : '') +
      '<a class="btn btn-lg" href="/library">' + icon('grid') + 'Browse library</a></div></div></div>' +
      '<div class="lh-stats">' +
      lhStat('layers', games.length, 'Games and ideas') +
      lhStat('play', playable.length, 'Playable demos') +
      lhStat('users', week.players, 'Players this week', dChip(change(week.players, prevPlayers))) +
      lhStat('clock', S.formatHours(week.minutes), 'Played this week', dChip(change(week.minutes, prevMinutes))) +
      '</div></section>' +

      '<nav class="quick" aria-label="Browse games"><span class="label">Browse</span>' +
      qchip('/library', 'grid', 'All games', playable.length) + qchip('/library?type=arcade', 'joystick', 'Arcade', counts.arcade) + qchip('/library?type=rng', 'dice', 'RNG', counts.rng) +
      '<span class="quick-sep"></span>' +
      qchip('/library?sort=rated', 'star', 'Top rated') + qchip('/library?sort=latest', 'sparkle', 'Newest') + qchip('/stats', 'chart', 'Platform stats') + '</nav>' +

      (featured
        ? '<section class="section" style="margin-top:28px">' + head('flame', 'Trending this week', '<a href="/library?sort=played">Most played →</a>') +
          '<div class="top-games">' +
          '<article class="featured"><a href="/game/' + featured.id + '" class="cover" aria-label="' + esc(featured.title) + '">' + coverHtml(featured) + '</a><span class="featured-flag chip">' + icon('flame') + '#1 this week</span>' +
          '<div class="featured-body"><div><h3>' + esc(featured.title) + '</h3><div class="byline" style="margin-top:6px">' + avatar(userById(featured.authorId), 'sm') + '<b>' + esc(userById(featured.authorId).name) + '</b><span>· ' + fmt(fStats.sessions) + ' sessions, ' + fStats.players + ' players this week</span></div></div>' +
          '<div style="display:flex;gap:8px"><a class="btn" href="/game/' + featured.id + '">Details</a><button class="btn btn-primary" data-action="play" data-id="' + featured.id + '">' + PLAY + 'Play</button></div></div></article>' +
          '<div class="side-games">' + side.map(sideGame).join('') + '</div></div></section>'
        : '') +

      (jump.length
        ? '<section class="section">' + head('refresh', 'Jump back in', '<span class="note faint">Games you played recently</span>') +
          '<div class="resume-grid">' + jump.slice(0, 4).map((x) =>
            '<article class="resume"><a class="cover" href="/game/' + x.g.id + '" tabindex="-1" aria-hidden="true">' + coverHtml(x.g) + '</a>' +
            '<div class="resume-body"><a href="/game/' + x.g.id + '"><b>' + esc(x.g.title) + '</b></a><small>Played ' + daysAgoText(x.s.daysAgo) + ' · ' + S.formatMinutes(x.s.minutes) + '</small></div>' +
            '<button type="button" class="btn btn-sm btn-primary" data-action="play" data-id="' + x.g.id + '" aria-label="Play ' + esc(x.g.title) + '">' + PLAY + 'Play</button></article>').join('') + '</div></section>'
        : '') +

      '<section class="section">' + head('sparkle', 'Just added', '<a href="/library?sort=latest">All games →</a>') + '<div class="grid">' + latest.map(gameCard).join('') + '</div></section>' +
      (rated.length ? '<section class="section">' + head('star', 'Top rated', '<a href="/library?sort=rated">All top rated →</a>') + '<div class="grid">' + rated.map(gameCard).join('') + '</div></section>' : '') +
      '<section class="section cols-2">' +
      '<div>' + head('bulb', 'Ideas looking for builders', '<a href="/add">Add an idea →</a>') +
      '<div class="stack" style="gap:12px">' + (ideas.length ? ideas.map((g) => '<a class="panel idea-card" href="/game/' + g.id + '"><div class="cover" style="width:120px;flex:none;border-radius:6px">' + coverHtml(g) + '</div><div style="min-width:0"><h3 style="font-size:16px">' + esc(g.title) + '</h3><p class="muted" style="font-size:14px">' + esc(g.tagline) + '</p><div class="byline" style="margin-top:6px">' + avatar(userById(g.authorId), 'sm') + esc(userById(g.authorId).name) + ' · ' + UP.replace('<svg', '<svg width="9" height="9"') + ' ' + upvotesOf(g) + '</div></div></a>').join('') : '<div class="empty"><img class="empty-logo" src="' + BRAND_MARK + '" alt=""><b>No open ideas right now.</b><span>Have one? <a href="/add" style="color:var(--lime)">Add an idea</a></span></div>') + '</div></div>' +
      '<div>' + head('trophy', 'Top gamers this week', '<a href="/stats/board">Gamers board →</a>') +
      '<div class="panel table-wrap" style="padding:6px 8px"><table class="data"><thead><tr><th>#</th><th>Player</th><th class="num">Play time</th><th class="num">Sessions</th></tr></thead><tbody>' +
      gamers.map((x, i) => '<tr class="clickable' + (x.u.id === state.currentUserId ? ' me' : '') + '" data-action="open-user" data-id="' + x.u.id + '"><td class="rank' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</td><td><div class="who-cell">' + avatar(x.u, 'sm') + '<b>' + esc(x.u.name) + '</b>' + roleTag(x.u) + '</div></td><td class="num">' + S.formatMinutes(x.s.minutes) + '</td><td class="num">' + x.s.sessions + '</td></tr>').join('') +
      '</tbody></table></div></div>' +
      '</section>'
    );
  }

  function libraryPage() {
    const L = ui.lib;
    const q = (L.q || '').trim().toLowerCase();
    const all = visibleGames();
    const demos = all.filter((g) => g.format !== 'idea').length;
    const matches = (g) => !q || [g.title, g.tagline, (g.tags || []).join(' '), userById(g.authorId).name].join(' ').toLowerCase().includes(q);
    const isIdea = (g) => g.format === 'idea';
    const base = all.filter((g) => (L.author === 'all' || g.authorId === L.author) && matches(g) && (L.format === 'all' || (L.format === 'idea') === isIdea(g)));
    const count = { all: base.length, arcade: base.filter((g) => g.type === 'arcade').length, rng: base.filter((g) => g.type === 'rng').length };
    const list = base
      .filter((g) => L.type === 'all' || g.type === L.type)
      .sort({
        latest: (a, b) => a.addedDaysAgo - b.addedDaysAgo,
        popular: (a, b) => upvotesOf(b) - upvotesOf(a),
        rated: (a, b) => ratingOf(b).avg - ratingOf(a).avg,
        played: (a, b) => gameStats(b.id, 30).sessions - gameStats(a.id, 30).sessions,
        discussed: (a, b) => commentsOf(b.id).length - commentsOf(a.id).length,
      }[L.sort]);
    const sorts = [['latest', 'Latest'], ['popular', 'Most popular'], ['rated', 'Top rated'], ['played', 'Most played'], ['discussed', 'Most discussed']];
    const cnt = (n) => ' <i class="cnt num">' + n + '</i>';
    const filtered = !!q || L.author !== 'all' || L.type !== 'all' || L.format !== 'all';
    const chips =
      (q ? '<span class="filter-chip">“' + esc(L.q.trim()) + '”<button type="button" data-action="lib-clear-q" aria-label="Clear search">' + icon('x') + '</button></span>' : '') +
      (L.author !== 'all' ? '<span class="filter-chip">By ' + esc(userById(L.author).name) + '<button type="button" data-action="lib-clear-author" aria-label="Show games by everyone">' + icon('x') + '</button></span>' : '') +
      (filtered ? '<button type="button" class="link-btn" data-action="lib-reset">Clear all filters</button>' : '');
    return (
      pageHero('grid', 'Browse', 'Game library', all.length + ' games and ideas from Evolution colleagues. <b>' + demos + '</b> playable, <b>' + (all.length - demos) + '</b> still ideas.', '<a class="btn btn-primary" href="/add">' + icon('plus') + 'Add game</a>') +
      '<div class="toolbar lib-toolbar" role="search">' +
      '<label class="lib-search">' + icon('search') + '<span class="sr-only">Search the library</span><input id="lib-q" type="search" autocomplete="off" spellcheck="false" placeholder="Search by title, tag or author" value="' + esc(L.q || '') + '"></label>' +
      seg('lib-type', [['all', 'All' + cnt(count.all)], ['arcade', 'Arcade' + cnt(count.arcade)], ['rng', 'RNG' + cnt(count.rng)]], L.type) +
      seg('lib-format', [['all', 'Any'], ['demo', 'Demos'], ['idea', 'Ideas']], L.format) +
      '<label class="lib-sort"><span>Sort by</span><select id="lib-sort-select">' + sorts.map((o) => '<option value="' + o[0] + '"' + (L.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>' +
      '</div>' +
      '<div class="active-filters" aria-live="polite"><span class="num">' + list.length + ' ' + (list.length === 1 ? 'game' : 'games') + '</span>' + chips + '</div>' +
      (list.length
        ? '<div class="grid">' + list.map(gameCard).join('') + '</div>'
        : '<div class="empty"><img class="empty-logo" src="' + BRAND_MARK + '" alt=""><b>' + (filtered ? 'No games match these filters.' : 'No games here yet.') + '</b><span>' + (filtered ? 'Try a different search, or clear the filters.' : 'Add the first one.') + '</span>' + (filtered ? '<button type="button" class="btn btn-sm" data-action="lib-reset">Clear all filters</button>' : '<a class="btn btn-sm" href="/add">Add a game</a>') + '</div>')
    );
  }

  function gamePage(id, tab) {
    const game = gameById(id);
    if (!game) return '<div class="empty"><b>This game does not exist.</b><a class="btn btn-sm" href="/library">Back to the library</a></div>';
    const author = userById(game.authorId);
    const isOwner = game.authorId === state.currentUserId;
    const playing = !!(ui.player && ui.player.gameId === game.id);
    const s30 = gameStats(game.id, 30);
    const rating = ratingOf(game);
    const mine = state.ratings[game.id] || 0;
    const voted = !!state.upvoted[game.id];
    const comments = commentsOf(game.id);
    const tabsList = [['overview', 'Overview'], ['stats', 'Stats'], ['readme', 'README'], ['video', 'Video manual'], ['comments', 'Comments', comments.length]];

    let body = '';
    if (tab === 'stats') body = gameStatsTab(game);
    else if (tab === 'readme') body = '<div class="panel"><article class="readme">' + markdown(game.readme).replace(/<(h[123])>/g, (m, h) => '<' + h + ' role="heading" aria-level="' + (Number(h[1]) + 1) + '">') + '</article></div>';
    else if (tab === 'video') body = videoTab(game, isOwner);
    else if (tab === 'comments') body = commentsTab(game, comments);
    else body = overviewTab(game, comments);

    return (
      '<div class="crumbs"><a href="/library">Library</a><span>/</span><span>' + esc(game.title) + '</span></div>' +
      (playing ? '<div class="player-slot" id="player-slot"></div>' : '') +
      '<div class="detail-head' + (playing ? ' playing' : '') + '">' +
      (playing ? '' : '<div class="detail-cover"><div class="cover">' + coverHtml(game) + '</div>' +
        (game.format === 'idea' ? '' : '<button class="cover-play" data-action="play" data-id="' + game.id + '" aria-label="Play ' + esc(game.title) + '"><span class="ring">' + PLAY.replace('<svg', '<svg width="30" height="30"') + '</span><span>Play demo</span></button>') + '</div>') +
      '<div class="detail-info">' +
      '<div class="chips">' + typeChip(game) + formatChip(game) + (game.core ? '<span class="chip quiet">Core: ' + game.core + '</span>' : '') + '<span class="chip quiet">' + STAGE_LABEL[game.stage] + '</span><span class="chip quiet">v' + esc(game.version) + '</span></div>' +
      '<h1>' + esc(game.title) + '</h1><p class="tagline">' + esc(game.tagline) + '</p>' +
      '<div class="byline">' + avatar(author) + '<span><b>' + esc(author.name) + '</b> · ' + esc(roleText(author)) + '<br><span class="faint">Added ' + daysAgoText(game.addedDaysAgo) + ', updated ' + daysAgoText(game.updatedDaysAgo) + '</span></span></div>' +
      '<div class="detail-actions">' +
      (game.format === 'idea' ? '<button class="btn btn-lg" disabled>No demo yet</button>' : playing ? '<button class="btn btn-lg" data-action="close-player">' + icon('x') + 'Stop playing</button>' : '<button class="btn btn-primary btn-lg" data-action="play" data-id="' + game.id + '">' + PLAY + 'Play demo</button>') +
      '<button class="vote lg' + (voted ? ' on' : '') + '" data-action="vote" data-id="' + game.id + '" aria-pressed="' + voted + '">' + UP + fmt(upvotesOf(game)) + '</button>' +
      '<button class="btn btn-lg" data-action="copy-link">' + icon('link') + 'Copy link</button>' +
      (isOwner ? '<a class="btn btn-lg" href="/my">Manage</a>' : '') +
      '</div>' +
      '<div class="rate"><span>Want more?</span><span class="scale">' + [1, 2, 3, 4, 5].map((v) => '<button type="button" class="' + (mine === v ? 'on' : '') + '" data-action="rate" data-id="' + game.id + '" data-v="' + v + '" aria-label="Rate ' + v + ' of 5">' + v + '</button>').join('') + '</span>' +
      '<span>' + (rating.count ? '<b style="color:var(--paper)">' + rating.avg.toFixed(1) + '</b> from ' + rating.count + ' ratings' : 'No ratings yet') + '</span></div>' +
      '<div class="facts"><div><b class="num">' + fmt(s30.sessions) + '</b><span>Sessions, 30 days</span></div><div><b class="num">' + s30.players + '</b><span>Players</span></div><div><b class="num">' + (s30.sessions ? S.formatMinutes(s30.avgMinutes) : '–') + '</b><span>Avg session</span></div></div>' +
      '</div></div>' +
      '<nav class="tabs" aria-label="Game sections">' + tabsList.map((t) => '<a href="/game/' + game.id + '/' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + t[1] + (t[2] !== undefined ? ' <span class="count">' + t[2] + '</span>' : '') + '</a>').join('') + '</nav>' +
      body
    );
  }

  function demoInstructions(game) {
    const d = game.demo;
    if (!d) return '<p class="muted">Idea only. No demo uploaded yet.</p>';
    if (d.kind === 'bundled' || d.kind === 'uploaded') return '<p>Runs right here in a sandboxed frame.</p>';
    if (d.kind === 'uploaded-zip') return '<p>Zipped demo <span class="mono">' + esc(d.fileName) + '</span>. The platform unpacks it on upload.</p>';
    if (d.kind === 'bench') return '<p>The demo folder is not on this server yet.</p><pre class="mono" style="margin:8px 0 0;font-size:13px">yarn new-game ' + esc(game.id) + '\n# ' + esc(d.path) + '</pre>';
    return '<p>Runs with its own game server.</p><pre class="mono" style="margin:8px 0 0;font-size:13px">' + esc(d.command || '') + '\n# client: ' + esc(d.url) + '</pre>';
  }

  function overviewTab(game, comments) {
    const p = game.passport;
    const similar = visibleGames().filter((g) => g.id !== game.id && g.type === game.type && g.format !== 'idea').sort((x, y) => upvotesOf(y) - upvotesOf(x)).slice(0, 4);
    const rows = [['Kind', p.kind], ['Core', game.core || 'None'], ['Randomness', p.randomness], ['Player decisions', p.decisions], ['Round format', p.roundFormat], ['Business model', p.business], ['Embedding level', p.embedding], ['Red flags', p.redFlags]];
    return (
      '<div class="cols-3-1">' +
      '<div class="stack"><section class="panel"><div class="panel-head"><h3>About</h3></div><p style="font-size:16px;line-height:1.6;max-width:68ch">' + esc(game.description) + '</p>' +
      '<div class="chips" style="margin-top:14px">' + game.tags.map((t) => '<span class="chip quiet">' + esc(t) + '</span>').join('') + '</div></section>' +
      '<section class="panel passport"><div class="panel-head"><h3>Passport</h3><span class="note">From docs/passports, written before the code</span></div><dl>' +
      rows.map((r) => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl></section></div>' +
      '<div class="stack"><section class="panel"><div class="panel-head"><h3>Demo</h3><span class="chip">' + FORMAT_LABEL[game.format] + '</span></div>' + demoInstructions(game) + '</section>' +
      '<section class="panel"><div class="panel-head"><h3>Latest comments</h3><a class="note link" href="/game/' + game.id + '/comments">All ' + comments.length + '</a></div>' +
      (comments.length ? comments.slice(0, 2).map((c) => '<div style="padding:8px 0;border-top:1px solid var(--rule)"><div class="byline">' + avatar(userById(c.userId), 'sm') + '<b>' + esc(userById(c.userId).name) + '</b><span>' + ago(c.hoursAgo) + '</span></div><p style="margin-top:6px;font-size:14px">' + esc(c.text) + '</p></div>').join('') : '<p class="muted">No comments yet.</p>') +
      '</section></div></div>' +
      (similar.length ? '<section class="section">' + secHead('sparkle', 'More like this', '<a href="/library?type=' + game.type + '">All ' + TYPE_LABEL[game.type] + ' games →</a>') + '<div class="grid">' + similar.map(gameCard).join('') + '</div></section>' : '')
    );
  }

  function gameStatsTab(game) {
    if (game.format === 'idea') {
      return '<div class="empty"><b>No play data yet.</b><span>Stats start with the first playable demo.</span>' + (game.authorId === state.currentUserId ? '<a class="btn btn-sm" href="/my">Add a demo</a>' : '') + '</div>';
    }
    const days = ui.gameDays;
    const st = gameStats(game.id, days);
    const liveDays = Math.max(2, Math.min(days, game.addedDaysAgo + 1));
    const rating = ratingOf(game);
    const list = [
      { label: 'Sessions', value: fmt(st.sessions), sub: 'Last ' + days + ' days', accent: true },
      { label: 'Players', value: st.players, sub: 'Unique colleagues' },
      { label: 'Play time', value: S.formatHours(st.minutes), sub: fmt(st.minutes) + ' minutes' },
      { label: 'Avg session', value: st.sessions ? S.formatMinutes(st.avgMinutes) : '–' },
      { label: 'Came back', value: pct(st.returning), sub: 'Played on 2+ days' },
      { label: 'Want more?', value: rating.count ? rating.avg.toFixed(1) : '–', sub: rating.count + ' ratings, 1–5 scale' },
    ];
    if (game.type === 'rng' && st.stake > 0) {
      list.push({ label: 'Rounds', value: fmt(st.rounds), sub: fmt(st.stake) + ' demo credits staked' });
      list.push({ label: 'Observed RTP', value: (st.observedRtp * 100).toFixed(1) + '%', sub: game.rtp ? 'Target ' + (game.rtp * 100).toFixed(1) + '%' : 'No target set' });
    }
    if (game.type === 'arcade') list.push({ label: 'Best score', value: fmt(st.bestScore) });
    const top = st.topPlayers.slice(0, 8);
    return (
      '<div class="page-head" style="margin-bottom:14px"><div><h2 style="font-size:20px">Game stats</h2><p>From the round events this demo emits.</p></div>' + seg('game-period', [[7, '7 days'], [30, '30 days']], days) + '</div>' +
      tiles(list) +
      '<div class="stack" style="margin-top:20px">' +
      areaPanel('game-daily', 'Sessions per day', liveDays < days ? gameStats(game.id, liveDays).daily : st.daily, 'sessions', liveDays < days ? 'Since it was added ' + daysAgoText(game.addedDaysAgo) : '') +
      heatPanel('When colleagues play', st.heatmap) +
      '<div class="cols-2">' +
      '<section class="panel"><div class="panel-head"><h3>Session length</h3><span class="note">Minutes per session</span></div>' + C.slot('hist', { counts: st.lengths.counts, labels: st.lengths.labels, labelUnit: 'min', unit: 'sessions', label: 'Session length' }) + '</section>' +
      '<section class="panel" style="padding:12px 8px"><div class="panel-head" style="padding:6px 12px 0"><h3>Top players</h3><a class="note link" href="/stats/board">Gamers board</a></div><div class="table-wrap"><table class="data"><thead><tr><th>#</th><th>Player</th><th class="num">Sessions</th><th class="num">Play time</th>' + (game.type === 'arcade' ? '<th class="num">Best</th>' : '') + '</tr></thead><tbody>' +
      top.map((p, i) => {
        const u = userById(p.userId);
        return '<tr class="clickable' + (u.id === state.currentUserId ? ' me' : '') + '" data-action="open-user" data-id="' + u.id + '"><td class="rank' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</td><td><div class="who-cell">' + avatar(u, 'sm') + '<b>' + esc(u.name) + '</b></div></td><td class="num">' + p.sessions + '</td><td class="num">' + S.formatMinutes(p.minutes) + '</td>' + (game.type === 'arcade' ? '<td class="num">' + fmt(p.best) + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div></section>' +
      '</div></div>'
    );
  }

  function videoTab(game, isOwner) {
    if (!game.video) {
      return '<div class="empty"><b>No video manual yet.</b><span>A short screen recording helps colleagues play the demo the right way.</span>' + (isOwner ? '<a class="btn btn-sm" href="/my">Upload a video</a>' : '') + '</div>';
    }
    const v = game.video;
    const progress = v.chapters.length > 1 ? (ui.video.chapter / (v.chapters.length - 1)) * 100 : 0;
    return (
      '<div class="video"><div class="video-frame"><div class="cover">' + coverHtml(game) + '</div>' +
      '<button class="video-play" data-action="video-play"><span class="ring">' + PLAY.replace('<svg', '<svg width="28" height="28" style="color:#0F1011"') + '</span><span>' + (ui.video.playing ? 'Playing: ' + esc(v.chapters[ui.video.chapter][1]) : 'Video manual · ' + esc(v.duration)) + '</span></button>' +
      '<div class="video-bar"><i style="width:' + (ui.video.playing ? Math.max(4, progress) : 0) + '%"></i></div></div>' +
      '<section class="panel"><div class="panel-head"><h3>Chapters</h3><span class="note mono">' + esc(v.duration) + '</span></div><ol class="chapters">' +
      v.chapters.map((c, i) => '<li><button data-action="video-chapter" data-i="' + i + '" class="' + (ui.video.playing && ui.video.chapter === i ? 'on' : '') + '"><span class="t">' + c[0] + '</span><span>' + esc(c[1]) + '</span></button></li>').join('') +
      '</ol><p class="muted" style="font-size:13px;margin-top:12px">Prototype: the recording itself is not bundled.</p></section></div>'
    );
  }

  function commentsTab(game, comments) {
    const user = me();
    return (
      '<div class="comments">' +
      '<form class="comment-form" data-form="comment" data-id="' + game.id + '">' + avatar(user) + '<div><label class="sr-only" for="comment-text">Comment</label><textarea id="comment-text" rows="3" placeholder="What did you like? What would you change?"></textarea>' +
      '<div class="row"><span>Commenting as ' + esc(user.name) + '</span><button class="btn btn-primary btn-sm" type="submit">Post comment</button></div></div></form>' +
      (comments.length ? comments.map((c) => {
        const u = userById(c.userId);
        const liked = !!state.likes[c.id];
        return '<article class="comment">' + avatar(u) + '<div><div class="comment-head"><b>' + esc(u.name) + '</b><span>' + esc(roleText(u)) + '</span><span>· ' + ago(c.hoursAgo) + '</span></div><p>' + esc(c.text) + '</p>' +
          '<button class="like' + (liked ? ' on' : '') + '" data-action="like" data-id="' + c.id + '" aria-pressed="' + liked + '">' + UP.replace('<svg', '<svg width="9" height="9"') + ((c.likes || 0) + (liked ? 1 : 0)) + '</button></div></article>';
      }).join('') : '<div class="empty"><b>No comments yet.</b><span>Be the first to leave feedback.</span></div>') +
      '</div>'
    );
  }

  function statsHead(active, intro, controls, extra) {
    const tab = (key, href, label) => '<a href="' + href + '" class="' + (active === key ? 'on' : '') + '"' + (active === key ? ' aria-current="page"' : '') + '>' + label + '</a>';
    return (
      pageHero('trophy', 'Leaderboard', 'Stats', intro, extra) +
      '<nav class="tabs" style="margin:20px 0 16px" aria-label="Stats sections">' + tab('platform', '/stats', 'Platform stats') + tab('board', '/stats/board', 'Gamers board') + '</nav>' +
      '<div class="board-controls">' + controls + '</div>'
    );
  }

  // ---------- platform stats ----------

  const ROLE_ABBR = { Engineering: 'ENG', 'Game Presenter': 'PRS', 'Game Math': 'MTH', Product: 'PRD', Designer: 'DSN', QA: 'QA', Operations: 'OPS', 'Customer Support': 'CS' };
  const ROLE_COLORS = ['#C6F432', '#7DB2EC', '#B79CF2', '#8AB223', '#6B6F66', '#E9B44C'];
  const CONTRIB_ICONS = ['gamepad', 'chat', 'chart', 'users'];

  const mean = (list) => (list.length ? list.reduce((a, b) => a + b, 0) / list.length : 0);
  const change = (now, before) => (before > 0 ? (now - before) / before : null);

  function fmtDuration(minutes) {
    const total = Math.round(minutes * 60);
    return Math.floor(total / 60) + 'm ' + String(total % 60).padStart(2, '0') + 's';
  }

  function deltaChip(x, cls) {
    if (x === null || !isFinite(x)) return '';
    const up = x >= 0;
    return '<span class="st-delta ' + (cls || '') + (up ? '' : ' down') + '"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="' + (up ? 'M1.5 7 5 3l3.5 4' : 'M1.5 3 5 7l3.5-4') + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' + (Math.abs(x) >= 10 ? '999%+' : Math.abs(x) >= 1 ? Math.round(Math.abs(x) * 100) + '%' : (Math.abs(x) * 100).toFixed(1) + '%') + '</span>';
  }

  function uniquePerDay(list, n) {
    const sets = Array.from({ length: n }, () => new Set());
    list.forEach((s) => {
      if (s.daysAgo < n) sets[n - 1 - s.daysAgo].add(s.userId);
    });
    return sets.map((set) => set.size);
  }

  function miniArea(values, w, h) {
    const max = Math.max(1, ...values);
    const n = values.length;
    const x = (i) => (i / Math.max(1, n - 1)) * w;
    const y = (v) => h - 8 - (v / max) * (h - 18);
    const line = 'M' + values.map((v, i) => x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' L');
    const last = values[n - 1];
    return (
      '<div class="st-area-wrap"><svg class="st-area" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="st-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6F432" stop-opacity=".32"/><stop offset="1" stop-color="#C6F432" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + line + ' L' + w + ' ' + h + ' L0 ' + h + 'Z" fill="url(#st-grad)"/><path d="' + line + '" fill="none" stroke="#C6F432" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>' +
      '<span class="st-area-end" style="top:' + ((y(last) / h) * 100).toFixed(1) + '%"></span></div>'
    );
  }

  function statsRows(days, type) {
    const games = visibleGames().filter((g) => g.format !== 'idea' && (type === 'all' || g.type === type));
    const rows = games.map((g) => {
      const s = gameStats(g.id, days);
      return { g, sessions: s.sessions, players: s.players, minutes: s.minutes, avg: s.avgMinutes, returning: s.returning, rating: ratingOf(g).avg, votes: upvotesOf(g), rtp: s.observedRtp, trend: S.trend(g.id).delta };
    });
    const total = Math.max(1, rows.reduce((a, r) => a + r.minutes, 0));
    rows.forEach((r) => {
      r.share = r.minutes / total;
    });
    return rows;
  }

  function sortedStatsRows(days, type) {
    const k = ui.statsSort.key;
    return statsRows(days, type).sort((a, b) => ((b[k] || 0) - (a[k] || 0)) * -ui.statsSort.dir || b.minutes - a.minutes);
  }

  function exportStatsCsv() {
    const days = ui.statsDays;
    const cell = (v) => '"' + String(v).replace(/"/g, '""') + '"';
    const head = ['Rank', 'Game', 'Type', 'Sessions', 'Players', 'Play time (min)', 'Avg session (min)', 'Came back (%)', 'Want more (avg 1-5)', 'Upvotes', 'Share of play time (%)'];
    const lines = [head.map(cell).join(',')].concat(sortedStatsRows(days, ui.statsType).map((r, i) => [
      i + 1, r.g.title, TYPE_LABEL[r.g.type], r.sessions, r.players, Math.round(r.minutes), r.avg.toFixed(1), Math.round(r.returning * 100), r.rating ? r.rating.toFixed(2) : '', r.votes, (r.share * 100).toFixed(1),
    ].map(cell).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = 'evo-playground-stats-' + days + 'd.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    showToast('Exported ' + (lines.length - 1) + ' games as CSV');
  }

  function pills(action, options, current) {
    return '<div class="st-pills" role="group">' + options.map((o) => '<button type="button" class="' + (String(current) === String(o[0]) ? 'on' : '') + '" data-action="' + action + '" data-v="' + o[0] + '" aria-pressed="' + (String(current) === String(o[0])) + '">' + o[1] + '</button>').join('') + '</div>';
  }

  function statsPage() {
    const days = ui.statsDays;
    const type = ui.statsType;
    const st = S.platformStats(days, type);
    const sessions = S.sessionsWhere({ days, type });
    const games = visibleGames().filter((g) => type === 'all' || g.type === type);
    const playable = games.filter((g) => g.format !== 'idea');
    const roleOf = {};
    D.USERS.forEach((u) => {
      roleOf[u.id] = u.role;
    });

    // Comparison window: the same number of days right before, capped so it stays inside the 30-day data window
    const cmp = Math.min(days, 15);
    const cur = S.sessionsWhere({ days: cmp, type });
    const prev = S.sessionsWhere({ days: cmp * 2, type }).filter((s) => s.daysAgo >= cmp);
    const curAvg = cur.length ? cur.reduce((a, s) => a + s.minutes, 0) / cur.length : 0;
    const prevAvg = prev.length ? prev.reduce((a, s) => a + s.minutes, 0) / prev.length : 0;
    const dauNow = mean(uniquePerDay(cur, cmp));
    const dauPrev = mean(uniquePerDay(prev.map((s) => Object.assign({}, s, { daysAgo: s.daysAgo - cmp })), cmp));
    const vsText = 'vs previous ' + cmp + ' days';

    const dailyUnique = uniquePerDay(sessions, days);
    const dau = mean(dailyUnique);
    const mau = new Set(S.sessionsWhere({ days: 30, type }).map((s) => s.userId)).size;
    const peakIdx = st.daily.values.reduce((best, v, i) => (v > st.daily.values[best] ? i : best), 0);
    const reach = st.players / D.USERS.length;
    const live = playable.slice().sort((a, b) => gameStats(b.id, days).sessions - gameStats(a.id, days).sessions)[0];

    const buckets = [['< 4 min', 0, 4, 'var(--info)'], ['4–8 min', 4, 8, '#8AB223'], ['8+ min', 8, Infinity, 'var(--lime)']].map((b) => ({ label: b[0], color: b[3], n: sessions.filter((s) => s.minutes >= b[1] && s.minutes < b[2]).length }));
    const bucketTotal = Math.max(1, buckets.reduce((a, b) => a + b.n, 0));

    // Ratings
    const ratingCounts = (g) => {
      const counts = g.ratings.slice();
      if (state.ratings[g.id]) counts[state.ratings[g.id] - 1] += 1;
      return counts;
    };
    const rated = playable.map((g) => {
      const c = ratingCounts(g);
      const n = c.reduce((a, b) => a + b, 0);
      return { g, avg: ratingOf(g).avg, n, positive: n ? (c[3] + c[4]) / n : 0 };
    }).filter((x) => x.n > 0).sort((a, b) => b.avg - a.avg || b.n - a.n);
    const allReviews = rated.reduce((a, x) => a + x.n, 0);
    const ecoAvg = allReviews ? rated.reduce((a, x) => a + x.avg * x.n, 0) / allReviews : 0;
    const mood = (avg) => (avg >= 4.5 ? 'Overwhelming' : avg >= 4 ? 'Very positive' : avg >= 3.5 ? 'Positive' : 'Mixed');

    // Roles
    const byRole = {};
    sessions.forEach((s) => {
      const r = roleOf[s.userId];
      byRole[r] = byRole[r] || { role: r, minutes: 0, sessions: 0 };
      byRole[r].minutes += s.minutes;
      byRole[r].sessions += 1;
    });
    const roleRows = Object.values(byRole).sort((a, b) => b.minutes - a.minutes).slice(0, 6);
    const busiest = S.busiestCell(st.heatmap);
    const hh = (h) => String(h % 24).padStart(2, '0') + ':00';

    const authored = {};
    games.forEach((g) => {
      const r = userById(g.authorId).role;
      authored[r] = authored[r] || { role: r, list: [] };
      authored[r].list.push(g);
    });
    const contributors = Object.values(authored).sort((a, b) => b.list.length - a.list.length).slice(0, 4);

    // Ranking
    const allRows = sortedStatsRows(days, type);
    const top = allRows.slice(0, 10);
    const sortOpts = [['players', 'Active players'], ['sessions', 'Sessions'], ['minutes', 'Play time'], ['avg', 'Avg session'], ['returning', 'Came back']];
    const coreLabel = (g) => ((g.type === 'rng' && (D.CORES.find((c) => c.id === g.core) || {}).label) || g.tags[0] || TYPE_LABEL[g.type]);
    const trendDot = (t) => {
      const cls = t === null ? 'new' : t > 0.05 ? 'up' : t < -0.05 ? 'down' : 'flat';
      const label = t === null ? 'New this week' : cls === 'up' ? 'Trending up ' + Math.round(t * 100) + '% on last week' : cls === 'down' ? 'Down ' + Math.round(-t * 100) + '% on last week' : 'Steady vs last week';
      return '<span class="st-status ' + cls + '" title="' + label + '"><i></i><span class="sr-only">' + label + '</span></span>';
    };

    const head =
      '<div class="st-head"><div class="st-head-copy"><div class="st-eyebrow-row"><div class="st-eyebrow"><i></i>EVO Playground · Live ops telemetry</div><span class="st-node">Node: eu-central-01</span></div>' +
      '<h1>Platform Statistics &amp; Player Telemetry</h1>' +
      '<p>Aggregated play sessions, engagement and game ratings from every colleague. Every number comes from the same sessions as the game pages and the gamers board.</p></div>' +
      '<div class="st-controls">' + pills('stats-period', [[3, 'Last 3 days'], [7, '7 days'], [30, '30 days'], ['month', 'This month']], ui.statsMonth ? 'month' : days) +
      '<button type="button" class="btn st-export" data-action="stats-export">' + icon('download') + 'Export report / CSV</button></div></div>' +
      '<nav class="tabs" style="margin:20px 0 24px" aria-label="Stats sections"><a href="/stats" class="on" aria-current="page">Platform stats</a><a href="/stats/board">Gamers board</a>' + pills('stats-type', [['all', 'All games'], ['arcade', 'Arcade'], ['rng', 'RNG']], type).replace('class="st-pills"', 'class="st-pills st-type"') + '</nav>';

    const hero =
      '<section class="st-hero" aria-label="Headline numbers">' +
      '<article class="st-card st-live"><div class="st-live-top"><div><div class="st-label">' + icon('broadcast') + 'Sessions · last ' + days + ' days</div>' +
      '<div class="st-big-row"><span class="st-big num">' + fmt(st.sessions) + '</span>' + deltaChip(change(cur.length, prev.length), 'dark') + '</div>' +
      '<p class="st-sub">' + vsText + ' · ' + (st.players ? (st.sessions / st.players).toFixed(1) : '0') + ' sessions per player</p></div>' +
      '<div class="st-ring" role="img" aria-label="' + pct(reach) + ' of colleagues played"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(15,16,17,.16)" stroke-width="6"/><circle cx="40" cy="40" r="34" fill="none" stroke="#0F1011" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + (reach * 213.6).toFixed(1) + ' 213.6" transform="rotate(-90 40 40)"/></svg><div><b>' + pct(reach) + '</b><span>Reach</span></div></div></div>' +
      '<div class="st-live-metrics"><div><span class="st-label">Peak day</span><b class="num">' + st.daily.values[peakIdx] + '</b><small>' + esc(st.daily.labels[peakIdx]) + ' · sessions</small></div>' +
      '<div><span class="st-label">Avg session</span><b class="num">' + fmtDuration(st.avgMinutes) + '</b><small>across ' + playable.length + ' demos</small></div>' +
      '<div><span class="st-label">Play time</span><b class="num">' + S.formatHours(st.minutes) + '</b><small>' + S.formatMinutes(st.avgPerGamer) + ' per player</small></div></div>' +
      '<div class="st-live-foot"><span class="st-live-note"><i></i>' + playable.length + ' playable demos · ' + (games.length - playable.length) + ' ideas open</span>' +
      (live ? '<button type="button" class="st-live-btn" data-action="play" data-id="' + live.id + '">' + PLAY + 'Play ' + esc(live.title) + '</button>' : '') + '</div></article>' +

      '<article class="st-card st-dau"><div class="st-card-top"><span class="st-label">Unique players (DAU)</span>' + icon('users') + '</div>' +
      '<div class="st-big-row"><span class="st-mid num">' + dau.toFixed(1) + '</span>' + deltaChip(change(dauNow, dauPrev)) + '</div>' +
      '<p class="st-sub">MAU: ' + mau + ' of ' + D.USERS.length + ' colleagues active in cycle</p>' + miniArea(dailyUnique, 240, 84) +
      '<div class="st-strip"><div><span class="st-label">Sessions / day</span><b class="num">' + (st.sessions / days).toFixed(1) + '</b></div><div><span class="st-label">Reach</span><b class="num hl">' + pct(reach) + '</b></div></div></article>' +

      '<article class="st-card st-avg"><div class="st-card-top"><span class="st-label">Average playtime</span>' + icon('clock') + '</div>' +
      '<div class="st-big-row"><span class="st-mid num">' + fmtDuration(st.avgMinutes) + '</span>' + deltaChip(change(curAvg, prevAvg)) + '</div>' +
      '<p class="st-sub">Per player per day: ' + S.formatMinutes(days ? st.minutes / Math.max(1, st.players) / days : 0) + '</p>' +
      '<div class="st-brackets"><div class="st-brackets-head"><span class="st-label">Engagement time brackets</span><span class="st-label">100% total</span></div>' +
      '<div class="split st-split" role="img" aria-label="' + buckets.map((b) => b.label + ' ' + pct(b.n / bucketTotal)).join(', ') + '">' + buckets.map((b) => '<div style="width:' + (b.n / bucketTotal) * 100 + '%;background:' + b.color + '"></div>').join('') + '</div>' +
      '<div class="st-bracket-legend">' + buckets.map((b) => '<span><i class="dot" style="background:' + b.color + '"></i>' + b.label + ': <b>' + pct(b.n / bucketTotal) + '</b></span>').join('') + '</div></div>' +
      '<div class="st-strip"><span class="st-strip-label">' + icon('refresh') + 'Retention rate</span><b class="num hl">' + pct(st.returning) + '</b></div></article>' +
      '</section>';

    const ratedSection =
      '<section class="st-panel st-rated"><div class="st-panel-head"><div><h2>' + icon('star') + 'Most rated games</h2><p>Highest “want more” ratings from colleagues</p></div><span class="st-pill-tag">Top rated</span></div>' +
      (rated.length
        ? '<div class="st-rated-grid">' + rated.slice(0, 4).map((x) =>
          '<a class="st-rated-card" href="/game/' + x.g.id + '"><div class="st-rated-top"><span class="st-thumb cover">' + coverHtml(x.g) + '</span><div><b>' + esc(x.g.title) + '</b><span class="st-mood ' + (x.avg >= 4 ? 'good' : '') + '">' + mood(x.avg) + '</span></div></div>' +
          '<div class="st-rated-foot"><div><span class="st-rating">' + icon('star') + '<b class="num">' + x.avg.toFixed(2) + '</b></span><small>' + x.n + ' ratings</small></div><div class="st-pos"><b class="num">' + pct(x.positive) + '</b><small>Positive</small></div></div></a>').join('') + '</div>'
        : '<div class="empty">No ratings yet for this filter.</div>') +
      '<div class="st-panel-foot"><span>' + icon('shield') + 'Ecosystem average rating: <b>' + ecoAvg.toFixed(2) + ' ★</b></span><span class="st-foot-hl">' + fmt(allReviews) + ' ratings</span></div></section>';

    const rolesPlayed =
      '<section class="st-panel"><div class="st-panel-head"><div><h2>' + icon('gamepad') + 'What roles played the most</h2><p>Play time and session length by colleague role</p></div><span class="st-pill-tag">' + S.formatHours(st.minutes) + ' total</span></div>' +
      '<div class="st-roles">' + roleRows.map((r, i) => {
        const share = r.minutes / Math.max(1, st.minutes);
        return '<div class="st-role"><div class="st-role-row"><span class="st-abbr" style="color:' + ROLE_COLORS[i] + '">' + (ROLE_ABBR[r.role] || r.role.slice(0, 3).toUpperCase()) + '</span><b>' + esc(r.role) + '</b><span class="st-role-meta num">' + S.formatHours(r.minutes) + ' · ' + S.formatMinutes(r.minutes / r.sessions) + ' avg/session</span><span class="st-role-pct num" style="color:' + (i < 1 ? 'var(--lime)' : 'var(--paper)') + '">' + pct(share) + '</span></div>' +
          '<div class="st-track"><div style="width:' + Math.max(2, share * 100) + '%;background:' + ROLE_COLORS[i] + '"></div></div></div>';
      }).join('') + '</div>' +
      '<div class="st-panel-foot"><span>Dominant team playtime:</span><span class="st-foot-hl">' + (busiest.value > 0 ? busiest.weekday.toUpperCase() + ' ' + hh(busiest.hour) + '–' + hh(busiest.hour + 1) : '–') + '</span></div></section>';

    const rolesAdded =
      '<section class="st-panel"><div class="st-panel-head"><div><h2>' + icon('upload') + 'What roles added the most games</h2><p>Game and idea submissions by author role</p></div><span class="st-pill-tag blue">' + games.length + ' uploads</span></div>' +
      '<div class="st-contrib">' + contributors.map((c, i) => {
        const best = c.list.slice().sort((a, b) => upvotesOf(b) - upvotesOf(a))[0];
        const demos = c.list.filter((g) => g.format !== 'idea').length;
        return '<article class="st-contrib-card' + (i === 0 ? ' lead' : '') + '"><div class="st-contrib-top"><span class="st-contrib-ic">' + icon(CONTRIB_ICONS[i]) + '</span><b class="st-contrib-pct num">' + pct(c.list.length / Math.max(1, games.length)) + '</b></div>' +
          '<h3>' + esc(c.role) + '</h3><p>' + c.list.length + (c.list.length === 1 ? ' game' : ' games') + ' · ' + demos + ' playable</p>' +
          '<div class="st-contrib-foot"><span>' + esc(best.title) + '</span><span class="st-foot-hl">#' + (i + 1) + ' contribution</span></div></article>';
      }).join('') + '</div>' +
      '<div class="st-panel-foot"><span>Publishing access:</span><span class="st-foot-hl">OPEN TO EVERY COLLEAGUE (OKTA SSO)</span></div></section>';

    const ranking =

  function boardPage() {
    const days = ui.boardDays;
    let table;
    let podiumRows = [];
    let ranked = [];
    if (ui.boardTab === 'creators') {
      const creators = D.USERS.map((u) => {
        const s = S.userStats(u.id, days);
        const own = D.GAMES.filter((g) => g.authorId === u.id && !g.hidden);
        const rated = own.map(ratingOf).filter((r) => r.count > 0);
        return { u, s, games: own.length, votes: own.reduce((a, g) => a + upvotesOf(g), 0), rating: rated.length ? rated.reduce((a, r) => a + r.avg, 0) / rated.length : 0 };
      }).filter((x) => x.games > 0).sort((a, b) => b.s.playsReceived - a.s.playsReceived || b.votes - a.votes);
      const max = Math.max(1, ...creators.map((c) => c.s.playsReceived));
      ranked = creators.map((c) => c.u);
      podiumRows = creators.slice(0, 3).map((c) => ({ u: c.u, value: fmt(c.s.playsReceived), label: 'plays received', sub: c.games + (c.games === 1 ? ' game' : ' games') + ' · ' + c.votes + ' upvotes' }));
      table = '<thead><tr><th>#</th><th>Creator</th><th class="num">Games</th><th>Plays received</th><th class="num">Players reached</th><th class="num">Upvotes</th><th class="num">Avg want more</th></tr></thead><tbody>' +
        creators.map((c, i) => '<tr class="clickable' + (c.u.id === state.currentUserId ? ' me' : '') + '" data-action="open-user" data-id="' + c.u.id + '"><td class="rank' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</td><td><div class="who-cell">' + avatar(c.u) + '<div><b>' + esc(c.u.name) + '</b><br>' + roleTag(c.u) + '</div></div></td><td class="num">' + c.games + '</td>' +
          '<td><span class="inline-bar" style="width:' + Math.max(2, (c.s.playsReceived / max) * 120) + 'px"></span><span class="num">' + fmt(c.s.playsReceived) + '</span></td><td class="num">' + c.s.playersReceived + '</td><td class="num">' + c.votes + '</td><td class="num">' + (c.rating ? c.rating.toFixed(1) : '–') + '</td></tr>').join('') + '</tbody>';
    } else {
      const players = D.USERS.map((u) => ({ u, s: S.userStats(u.id, days) })).filter((x) => x.s.sessions > 0).sort((a, b) => b.s.minutes - a.s.minutes);
      const max = Math.max(1, ...players.map((p) => p.s.minutes));
      ranked = players.map((p) => p.u);
      podiumRows = players.slice(0, 3).map((p) => ({ u: p.u, value: S.formatMinutes(p.s.minutes), label: 'play time', sub: p.s.sessions + ' sessions · ' + p.s.gamesPlayed + ' games' }));
      table = '<thead><tr><th>#</th><th>Player</th><th>Play time</th><th class="num">Sessions</th><th class="num">Games played</th><th>Favourite game</th><th class="num">Votes cast</th><th class="num">Comments</th></tr></thead><tbody>' +
        players.map((p, i) => {
          const fav = p.s.favourite ? gameById(p.s.favourite) : null;
          return '<tr class="clickable' + (p.u.id === state.currentUserId ? ' me' : '') + '" data-action="open-user" data-id="' + p.u.id + '"><td class="rank' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</td><td><div class="who-cell">' + avatar(p.u) + '<div><b>' + esc(p.u.name) + '</b><br>' + roleTag(p.u) + '</div></div></td>' +
            '<td><span class="inline-bar" style="width:' + Math.max(2, (p.s.minutes / max) * 120) + 'px"></span><span class="num">' + S.formatMinutes(p.s.minutes) + '</span></td><td class="num">' + p.s.sessions + '</td><td class="num">' + p.s.gamesPlayed + '</td><td>' + (fav ? esc(fav.title) : '–') + '</td><td class="num">' + votesCastBy(p.u) + '</td><td class="num">' + commentCountBy(p.u.id) + '</td></tr>';
        }).join('') + '</tbody>';
    }
    const myIdx = ranked.findIndex((u) => u.id === state.currentUserId);
    const podium = podiumRows.length
      ? '<section class="podium" aria-label="Top three">' + podiumRows.map((r, i) =>
        '<article class="pod pod-' + (i + 1) + (r.u.id === state.currentUserId ? ' me' : '') + '" data-action="open-user" data-id="' + r.u.id + '" tabindex="0" role="button" aria-label="' + esc(r.u.name) + ', rank ' + (i + 1) + '">' +
        '<span class="pod-rank">' + (i === 0 ? icon('trophy') : i + 1) + '</span>' + avatar(r.u, 'lg') +
        '<b class="pod-name">' + esc(r.u.name) + '</b>' + roleTag(r.u) +
        '<div class="pod-val num">' + r.value + '</div><small>' + r.label + ' · ' + esc(r.sub) + '</small></article>').join('') + '</section>'
      : '';
    const yourRank = myIdx > -1 ? '<div class="ph-rank"><span class="label">Your rank</span><b class="num">#' + (myIdx + 1) + '</b><small>of ' + ranked.length + '</small></div>' : '';
    return (
      statsHead('board', 'Who plays the most, and whose games get played. Select a row to see a colleague’s stats.', seg('board-tab', [['players', 'Players'], ['creators', 'Creators']], ui.boardTab) + seg('board-period', [[7, '7 days'], [30, '30 days']], days), yourRank) +
      podium +
      '<section class="panel" style="padding:8px"><div class="table-wrap"><table class="data">' + table + '</table></div></section>'
    );
  }

        '<div class="field"><span>Demo file</span><input type="file" accept=".html,.htm,.zip" data-file="manage">' + (d.file ? '<small>' + esc(d.file.name) + ' · ' + Math.round(d.file.size / 1024) + ' KB</small>' : '<small>The version number goes up by one patch on save.</small>') + '</div>' +
