            '<div style="min-width:0"><div class="chips">' + typeChip(g) + formatChip(g) + '<span class="chip quiet">v' + esc(g.version) + '</span>' + (g.hidden ? '<span class="chip quiet">Hidden</span>' : '') + '</div>' +
            '<h3 style="margin-top:8px"><a href="/game/' + g.id + '">' + esc(g.title) + '</a></h3>' +
            '<div class="meta"><span>Updated ' + daysAgoText(g.updatedDaysAgo) + '</span><span class="num">' + fmt(s.sessions) + ' sessions, 30 days</span><span class="num">' + upvotesOf(g) + ' upvotes</span><span class="num">' + commentsOf(g.id).length + ' comments</span></div></div>' +
            '<div class="manage-actions"><a class="btn btn-sm" href="/game/' + g.id + '/stats">' + icon('chart') + 'Stats</a>' +
            '<button class="btn btn-sm" data-action="edit-demo" data-id="' + g.id + '">' + icon('upload') + (g.format === 'idea' ? 'Add demo' : 'New version') + '</button>' +
            '<button class="btn btn-sm" data-action="toggle-hidden" data-id="' + g.id + '">' + icon('eye') + (g.hidden ? 'Show' : 'Hide') + '</button></div>' +

    );

  function myTotals(user, mine) {
    const s = S.userStats(user.id, 30);
    return tiles([
      { label: 'Games', value: mine.length, sub: mine.filter((g) => g.format !== 'idea').length + ' with a demo', accent: true },
      { label: 'Plays received', value: fmt(s.playsReceived), sub: 'Last 30 days, by colleagues' },
      { label: 'Players reached', value: s.playersReceived },
      { label: 'Upvotes', value: fmt(mine.reduce((a, g) => a + upvotesOf(g), 0)) },
      { label: 'Comments', value: fmt(mine.reduce((a, g) => a + commentsOf(g.id).length, 0)) },
    ]);
  }

  // ---------- add game wizard ----------

  const STEP_NAMES = ['Basics', 'Demo', 'Docs', 'Review'];

  function wizErrors(step) {
    const d = ui.wiz.draft;
    const e = {};
    if (step === 0) {
      if (d.title.trim().length < 3) e.title = 'Give the game a title of at least 3 characters.';
      if (d.tagline.trim().length < 8) e.tagline = 'Describe the game in one short sentence.';
      if (!d.type) e.type = 'Choose Arcade or RNG.';
    }
    if (step === 1) {
      if (d.demoKind === 'demo' && !d.htmlFile) e.html = 'Upload the demo file, or publish it as an idea.';
    }
    if (step === 2) {
      if (d.readme.trim().length < 10) e.readme = 'Add a short README: how to play and how to run it.';
    }
    return e;
  }

  function err(errors, key) {
    return errors[key] ? '<span class="err">' + esc(errors[key]) + '</span>' : '';
  }

  // Ideas go to Slack through the server (POST /api/ideas), so the webhook stays server-side.
  function ideasPage() {
    const s = ui.idea;
    const status = s.status === 'sent' ? '<span class="idea-status ok">Posted. Check the channel.</span>' :
      s.status === 'error' ? '<span class="idea-status err">' + esc(s.reason) + '</span>' : '';
    return (
      '<div class="page-head"><div><h1>Submit an idea</h1><p>Posts straight to the #workshop-ideas Slack channel. Comment and reply there. If it moves forward, the next step is a passport in docs/passports before any code.</p></div></div>' +
      '<form class="panel idea-form" data-form="idea"><div class="form-grid">' +
      '<div class="field"><label for="idea-title"><span>Title</span></label><input type="text" id="idea-title" name="title" maxlength="200" placeholder="Plinko with a side bet" required></div>' +
      '<div class="field"><label for="idea-by"><span>Your Slack name</span></label><input type="text" id="idea-by" name="submittedBy" maxlength="100" placeholder="How you are listed in Slack" required></div>' +
      '<div class="field wide"><label for="idea-desc"><span>Description</span></label><textarea id="idea-desc" name="description" rows="5" maxlength="4000" placeholder="What is the mechanic, what core does it map to, why is it fun" required></textarea></div>' +
      '<div class="field wide"><label for="idea-img"><span>Concept art URL</span></label><input type="url" id="idea-img" name="imageUrl" placeholder="https://…"><small>Optional</small></div>' +
      '</div><div class="idea-form-actions"><button type="submit" class="btn btn-primary"' + (s.status === 'sending' ? ' disabled' : '') + '>' + (s.status === 'sending' ? 'Posting…' : 'Post to Slack') + '</button>' + status + '</div></form>'
    );
  }

    const errors = w.tried[w.step] ? wizErrors(w.step) : {};
    if (w.step === 2 && !d.readme) d.readme = '# ' + (d.title.trim() || 'My game') + '\n\n## How to play\n- \n\n## Run\nOpen the HTML file in a browser.';
    memory.covers.preview = d.cover ? d.cover.url : null;
    let body = '';
    if (w.step === 0) {
      body =
        '<section class="panel"><div class="panel-head"><h3>Basics</h3><span class="note">Step 1 of 4</span></div><div class="form-grid">' +
        '<div class="field"><label for="w-title"><span>Title</span></label><input type="text" id="w-title" data-wiz="title" value="' + esc(d.title) + '" placeholder="Sunset Break">' + err(errors, 'title') + '</div>' +
        '<div class="field"><label for="w-tags"><span>Tags</span></label><input type="text" id="w-tags" data-wiz="tags" value="' + esc(d.tags) + '" placeholder="crash, live presenter"><small>Comma-separated</small></div>' +
        '<div class="field wide"><label for="w-tagline"><span>One-line pitch</span></label><input type="text" id="w-tagline" data-wiz="tagline" value="' + esc(d.tagline) + '" placeholder="Crash game on a surf wave. Cash out before the wave breaks.">' + err(errors, 'tagline') + '</div>' +
        '<div class="field wide"><label for="w-desc"><span>Description</span></label><textarea id="w-desc" rows="3" data-wiz="description" placeholder="What is the mechanic, and why is it fun?">' + esc(d.description) + '</textarea></div>' +

        '<label class="choice' + (d.type === 'rng' ? ' on' : '') + '"><input type="radio" name="w-type" value="rng" data-wiz-choice="type"' + (d.type === 'rng' ? ' checked' : '') + '><b>' + '<span class="chip rng">RNG</span></b><span>A server-side random outcome with demo credits. Maps onto one of the eight math cores.</span></label></div>' + err(errors, 'type') + '</div>' +

          ? '<div class="field"><label for="w-core"><span>Math core</span></label><select id="w-core" data-wiz-choice="core"><option value="">Not sure yet</option>' + D.CORES.map((c) => '<option value="' + c.id + '"' + (d.core === c.id ? ' selected' : '') + '>' + c.label + '</option>').join('') + '</select><small>' + esc((D.CORES.find((c) => c.id === d.core) || { hint: 'Pick the closest core. It can change after review.' }).hint) + '</small></div>'
          : '') +
        '<div class="field' + (d.type === 'rng' ? '' : ' wide') + '"><span>Cover image</span>' +
        (d.cover ? '<div class="file-ok"><img src="' + esc(d.cover.url) + '" alt="" style="width:64px;height:40px;object-fit:cover;border-radius:4px">' + esc(d.cover.name) + '<button class="btn btn-sm" style="margin-left:auto" data-action="wiz-clear" data-key="cover">Remove</button></div>' : '<input type="file" accept="image/*" data-file="cover"><small>Optional. Without art we draw a wireframe cover.</small>') + '</div>' +
        '</div></section>';
    } else if (w.step === 1) {
      const kinds = [['demo', 'Demo', 'A playable game: one .html file or a .zip with index.html. Colleagues can play it in minutes.'], ['idea', 'Idea', 'No demo yet. Publish the idea and find builders in the comments.']];
      body =
        '<section class="panel"><div class="panel-head"><h3>Demo or idea</h3><span class="note">Step 2 of 4</span></div><div class="choice-grid two">' +
        kinds.map((k) => '<label class="choice' + (d.demoKind === k[0] ? ' on' : '') + '"><input type="radio" name="w-demo" value="' + k[0] + '" data-wiz-choice="demoKind"' + (d.demoKind === k[0] ? ' checked' : '') + '><b>' + k[1] + '</b><span>' + k[2] + '</span></label>').join('') +
        '</div>' +
        (d.demoKind === 'demo'
          ? '<div style="margin-top:16px">' + (d.htmlFile
            ? '<div class="file-ok">' + icon('file') + '<div><b>' + esc(d.htmlFile.name) + '</b><div class="mono">' + Math.round(d.htmlFile.size / 1024) + ' KB' + (d.htmlFile.zip ? ' · zip, unpacked by the platform' : ' · ready to play') + '</div></div><div style="margin-left:auto;display:flex;gap:8px">' + (d.htmlFile.zip ? '' : '<button class="btn btn-sm" data-action="wiz-test">' + PLAY.replace('<svg', '<svg width="12" height="12"') + 'Test play</button>') + '<button class="btn btn-sm" data-action="wiz-clear" data-key="htmlFile">Replace</button></div></div>'
            : '<label class="drop" data-drop="html">' + icon('upload').replace('<svg', '<svg width="28" height="28"') + '<b>Drop your .html file here</b><span>or choose a file. A .zip with an index.html works too.</span><input type="file" accept=".html,.htm,.zip" data-file="html" class="sr-only"><span class="btn btn-sm">Choose file</span></label>') + err(errors, 'html') + '</div>'
          : '<p class="muted" style="margin-top:16px">The idea goes into the library with an \u201cIdea\u201d badge. You can add a demo later from My games.</p>') +
        '</section>';
    } else if (w.step === 2) {
      body =
        '<section class="panel"><div class="panel-head"><h3>README</h3><span class="note">Step 3 of 4 · Markdown</span></div><textarea id="w-readme" rows="9" data-wiz="readme" class="mono" style="font-size:13px">' + esc(d.readme) + '</textarea>' + err(errors, 'readme') + '</section>' +
        '<section class="panel"><div class="panel-head"><h3>Video manual</h3><span class="note">Optional. A short screen recording of how to play.</span></div>' +
        (d.video ? '<div class="file-ok">' + icon('file') + '<b>' + esc(d.video.name) + '</b><span class="mono">' + Math.round(d.video.size / 1048576 * 10) / 10 + ' MB</span><button class="btn btn-sm" style="margin-left:auto" data-action="wiz-clear" data-key="video">Remove</button></div>'
          : '<div class="form-grid"><div class="field"><span>Upload a video</span><input type="file" accept="video/*" data-file="video"></div><div class="field"><label for="w-vurl"><span>Or paste a link</span></label><input type="url" id="w-vurl" data-wiz="videoUrl" value="' + esc(d.videoUrl) + '" placeholder="https://…"></div></div>') +

        [d.demoKind === 'idea' ? 'Idea, no demo yet' : 'Demo: ' + (d.htmlFile ? d.htmlFile.name : 'missing'), d.demoKind === 'idea' || !!d.htmlFile],

        '<p class="wiz-tip">' + icon('bulb') + '<span>' + wizTips[w.step] + '</span></p></aside>'
      : '';
    return (

      '<div class="wizard-body">' + (live ? '<div class="wiz-split"><div class="wiz-main">' + body + '</div>' + live + '</div>' : body) +

  function draftGame(id) {

      rtp: null,
      upvotes: 0,
      ratings: [0, 0, 0, 0, 0],
      tags: d.tags.split(',').map((t) => t.trim()).filter(Boolean),

      description: d.description.trim() || d.tagline.trim(),
      passport: { kind: d.type === 'rng' ? 'Mechanic' : 'Game', randomness: 'To be filled in', decisions: 'To be filled in', roundFormat: 'To be filled in', business: d.type === 'rng' ? 'House-banked, demo credits' : 'None, internal game', embedding: 'To be decided', redFlags: 'Not reviewed yet' },
      readme: d.readme,

  function publish() {
    const d = ui.wiz.draft;
    let id = slugify(d.title);
    let n = 2;
    while (gameById(id)) id = slugify(d.title) + '-' + n++;
    const game = draftGame(id);
    if (d.cover) {
      memory.covers[id] = d.cover.url;
      if (d.cover.dataUrl && d.cover.dataUrl.length < 400000) game.cover = d.cover.dataUrl;
    }
    if (d.htmlFile && !d.htmlFile.zip) {
      memory.demoUrls[id] = d.htmlFile.url;
      try {
        if (d.htmlFile.text.length < MAX_STORED_DEMO) localStorage.setItem(DEMO_KEY + id, d.htmlFile.text);
      } catch (e) {
        game.demo.sessionOnly = true;
      }
    }
    D.GAMES.push(game);
    state.added.push(game);
    save();
    ui.wiz = { step: 0, tried: {}, draft: freshDraft() };
    navigate('/game/' + id);
    showToast(d.announce ? 'Published. Slack announcement simulated in this prototype.' : 'Published to the library.');
  }

  // ---------- layer: player, want-more, drawer ----------

  function demoUrl(game) {
    const d = game.demo;
    if (!d) return null;
    if (d.kind === 'bundled') return d.src;
    if (d.kind === 'uploaded') {
      if (memory.demoUrls[game.id]) return memory.demoUrls[game.id];
      try {
        const text = localStorage.getItem(DEMO_KEY + game.id);
        if (text) {
          memory.demoUrls[game.id] = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
          return memory.demoUrls[game.id];
        }
      } catch (e) {
        return null;
      }
    }
    return null;
  }

  // Host side of the game protocol (packages/protocol, version 1): the game posts game:ready,
  // the host answers host:init with the session seed, then the game posts game:event at will.
  const PROTOCOL_VERSION = 1;
  const LOG_LIMIT = 200;

  function newSession(seed) {
    const id = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => x.toString(16).padStart(2, '0')).join('');
    return { id, seed, log: [] };
  }

  function lastRound(session) {
    for (let i = session.log.length - 1; i >= 0; i--) {
      const entry = session.log[i];
      if (entry.kind === 'game_event' && entry.name === 'round' && entry.data && typeof entry.data === 'object') return entry.data;
    }
    return null;
  }

  function playerEventsText(session) {
    const n = session.log.length;
    const round = lastRound(session);
    return n + (n === 1 ? ' event' : ' events') + (round ? ' · round ' + esc(round.round) + ' · payout ' + esc(round.payout) : '');
  }

  function pushLog(entry) {
    const p = ui.player;
    if (!p || !p.session) return;
    p.session.log.push(entry);
    if (p.session.log.length > LOG_LIMIT) p.session.log.splice(0, p.session.log.length - LOG_LIMIT);
    const counter = document.getElementById('player-events');
    if (counter) counter.innerHTML = playerEventsText(p.session);
    const button = playerEl.querySelector('[data-action="download-log"]');
    if (button) button.disabled = false;
  }

  window.addEventListener('message', (e) => {
    const p = ui.player;
    const frame = playerEl.querySelector('iframe');
    if (!p || !p.session || !frame || e.source !== frame.contentWindow) return;
    const ts = Date.now();
    if (e.origin !== location.origin) {
      pushLog({ ts, kind: 'protocol_error', reason: 'origin ' + e.origin + ' does not match ' + location.origin });
      return;
    }
    const m = e.data;
    if (!m || typeof m !== 'object' || typeof m.type !== 'string') {
      pushLog({ ts, kind: 'protocol_error', reason: 'message is not a protocol object' });
      return;
    }
    if (m.type === 'game:ready') {
      if (m.protocol !== PROTOCOL_VERSION) {
        pushLog({ ts, kind: 'protocol_error', reason: 'protocol ' + String(m.protocol) + ' is not ' + PROTOCOL_VERSION });
        return;
      }
      pushLog({ ts, kind: 'ready' });
      frame.contentWindow.postMessage({ type: 'host:init', protocol: PROTOCOL_VERSION, sessionId: p.session.id, seed: p.session.seed, sandbox: true }, location.origin);
      pushLog({ ts: Date.now(), kind: 'init_sent', sessionId: p.session.id, seed: p.session.seed });
      return;
    }
    if (m.type === 'game:event') {
      if (typeof m.name !== 'string' || !m.name) {
        pushLog({ ts, kind: 'protocol_error', reason: 'game:event without a name' });
        return;
      }
      pushLog({ ts, kind: 'game_event', name: m.name, data: m.data });
      return;
    }
    pushLog({ ts, kind: 'protocol_error', reason: 'unknown message type ' + m.type });
  });

  function relaunchPlayer() {
    const p = ui.player;
    if (!p || !p.session) return;
    const input = document.getElementById('player-seed');
    const parsed = Number.parseInt(input ? input.value : '', 10);
    const seed = Number.isFinite(parsed) && parsed >= 0 ? parsed : 0;
    p.session = newSession(seed);
    renderPlayer();
  }

  function downloadLog() {
    const p = ui.player;
    if (!p || !p.session || !p.session.log.length) return;
    const game = p.preview || gameById(p.gameId);
    const payload = { game: game.id, version: game.version, session: { id: p.session.id, seed: p.session.seed }, log: p.session.log };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
    a.download = game.id + '-' + p.session.id + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function playerHtml() {
    const p = ui.player;
    const game = p.preview || gameById(p.gameId);
    const url = p.preview ? p.url : demoUrl(game);
    let inner;
    if (url) {
      inner = '<iframe src="' + esc(url) + '" title="' + esc(game.title) + ' demo" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms" allow="autoplay; fullscreen"></iframe>';
    } else if (game.demo && game.demo.kind === 'bench') {
      inner = '<div class="player-msg"><b>This demo is not on this server yet</b><span>Add the game folder to the repo, then restart the server and open ' + esc(game.title) + ' again.</span><pre>yarn new-game ' + esc(game.id) + '</pre><span class="mono" style="font-size:12px">' + esc(game.demo.path) + '</span></div>';
    } else if (game.demo && game.demo.kind === 'fullstack') {
      inner = '<div class="player-msg"><b>Fullstack demo with its own server</b><span>Start it from the repo root, then open the client.</span><pre>' + esc(game.demo.command || 'yarn dev') + '</pre><a class="btn btn-primary" href="' + esc(game.demo.url) + '" target="_blank" rel="noopener">' + icon('external') + 'Open ' + esc(game.demo.url) + '</a></div>';
    } else if (game.demo && game.demo.kind === 'uploaded-zip') {
      inner = '<div class="player-msg"><b>Zipped demo</b><span>The platform server unpacks zip uploads. This prototype runs single .html files only.</span></div>';
    } else {
      inner = '<div class="player-msg"><b>Demo file not available</b><span>Uploaded demos are kept in this browser. Upload the file again from My games.</span></div>';
    }
    const bar =
      '<div class="player-bar"><h3>' + esc(game.title) + '</h3><span class="meta">' + TYPE_LABEL[game.type] + (game.type === 'rng' ? ' · demo credits only' : '') + ' · <span id="player-clock">00:00</span></span><span class="spacer"></span>' +
      (url ? '<span class="meta" id="player-events">' + playerEventsText(p.session) + '</span><label class="meta seed">seed<input type="text" id="player-seed" inputmode="numeric" autocomplete="off" value="' + esc(p.session.seed) + '" aria-label="Seed for the next relaunch"></label>' +
        '<button class="btn btn-sm" data-action="relaunch">' + icon('refresh') + 'Relaunch</button><button class="btn btn-sm" data-action="download-log"' + (p.session.log.length ? '' : ' disabled') + '>' + icon('download') + 'Download log</button><button class="btn btn-sm" data-action="fullscreen">' + icon('expand') + 'Fullscreen</button>' : '') +
      '<button class="btn btn-sm" data-action="close-player" aria-label="Stop playing">' + icon('x') + (p.preview ? 'Close' : 'Stop') + '</button></div>';
    if (p.preview) {
      return '<div class="overlay" role="dialog" aria-modal="true" aria-label="' + esc(game.title) + ' player"><div class="player">' + bar + inner + '</div></div>';
    }
    return '<section class="player inline-player" aria-label="' + esc(game.title) + ' player">' + bar + inner + '</section>';
  }

  function wantMoreHtml() {
    const game = gameById(ui.wantMore.gameId);
    return '<div class="want-more" role="dialog" aria-label="Rate the demo"><div class="row"><b>Want more of ' + esc(game.title) + '?</b><button class="btn btn-sm" data-action="dismiss-want-more" aria-label="Dismiss">' + icon('x') + '</button></div>' +
      '<span class="muted" style="font-size:13px">You played ' + S.formatMinutes(ui.wantMore.minutes) + '. One question, 1–5.</span>' +
      '<div class="rate"><span class="scale">' + [1, 2, 3, 4, 5].map((v) => '<button type="button" data-action="rate" data-id="' + game.id + '" data-v="' + v + '" data-close="1">' + v + '</button>').join('') + '</span></div></div>';
  }

  function drawerHtml() {
    const u = userById(ui.drawerUser);
    const s = S.userStats(u.id, 30);
    const own = D.GAMES.filter((g) => g.authorId === u.id && !g.hidden);
    return (
      '<div class="drawer-wrap" data-action="close-drawer"><aside class="drawer" role="dialog" aria-label="' + esc(u.name) + ' stats" data-stop>' +
      '<div class="drawer-head">' + avatar(u, 'lg') + '<div style="flex:1"><h2>' + esc(u.name) + '</h2><div class="muted">' + esc(roleText(u)) + ' · <span class="mono" style="font-size:12px">Okta</span></div></div><button class="btn btn-sm" data-action="close-drawer" aria-label="Close">' + icon('x') + '</button></div>' +
      tiles([
        { label: 'Play time', value: S.formatHours(s.minutes), sub: 'Last 30 days', accent: true },
        { label: 'Sessions', value: s.sessions },
        { label: 'Games played', value: s.gamesPlayed },
        { label: 'Games created', value: s.created, sub: s.created ? fmt(s.playsReceived) + ' plays received' : '' },
      ]) +
      '<section><div class="panel-head"><h3>Play time by game</h3></div>' + (s.perGame.length ? hbars(s.perGame.slice(0, 6).map((g) => ({ label: gameById(g.key).title, value: g.minutes, display: S.formatMinutes(g.minutes), href: '/game/' + g.key }))) : '<p class="muted">No sessions in the last 30 days.</p>') + '</section>' +
      '<section><div class="panel-head"><h3>When ' + esc(u.name) + ' plays</h3></div>' + C.slot('heat', { grid: s.heatmap, rowLabels: S.WEEKDAYS, unit: 'sessions', label: 'Activity heatmap' }) + '</section>' +
      '<section><div class="panel-head"><h3>Games by ' + esc(u.name) + '</h3>' + (own.length ? '<a class="note link" href="/library?author=' + u.id + '">Show in library</a>' : '') + '</div>' +
      (own.length ? '<div class="stack" style="gap:8px">' + own.map((g) => '<a href="/game/' + g.id + '" class="panel" style="display:flex;gap:12px;align-items:center;padding:10px"><div class="cover" style="width:84px;flex:none;border-radius:4px">' + coverHtml(g) + '</div><div><b>' + esc(g.title) + '</b><div class="chips" style="margin-top:4px">' + typeChip(g) + formatChip(g) + '</div></div></a>').join('') + '</div>' : '<p class="muted">No games yet.</p>') + '</section>' +
      '</aside></div>'
    );
  }

  function renderLayer() {
    let html = '';
    if (ui.drawerUser) html += drawerHtml();
    if (ui.wantMore) html += wantMoreHtml();
    layerEl.innerHTML = html;
    C.mountAll(layerEl);
  }

  // The inline player lives outside #page and is laid over the slot on the game page,
  // because re-inserting an iframe into the DOM reloads the game.
  function placePlayer() {
    const box = playerEl.querySelector('.inline-player');
    if (!box) return;
    const slot = document.getElementById('player-slot');
    if (!slot) {
      box.hidden = true;
      return;
    }
    const r = slot.getBoundingClientRect();
    box.hidden = false;
    box.style.top = r.top + window.scrollY + 'px';
    box.style.left = r.left + window.scrollX + 'px';
    box.style.width = r.width + 'px';
    box.style.height = r.height + 'px';
  }

  let clockTimer = null;
  function renderPlayer() {
    playerEl.innerHTML = ui.player ? playerHtml() : '';
    placePlayer();
    clearInterval(clockTimer);
    if (ui.player) {
      clockTimer = setInterval(() => {
        const el = document.getElementById('player-clock');
        if (!el || !ui.player) return;
        const sec = Math.floor((Date.now() - ui.player.startedAt) / 1000);
        el.textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
      }, 1000);
    }
  }

  function closePlayer() {
    const p = ui.player;
    ui.player = null;
    if (p && !p.preview && p.playable) {
      const minutes = Math.max(0.5, Math.round(((Date.now() - p.startedAt) / 60000) * 2) / 2);
      const session = { id: 'm' + Date.now(), gameId: p.gameId, userId: state.currentUserId, daysAgo: 0, hour: new Date().getHours(), minutes };
      D.SESSIONS.push(session);
      state.mySessions.push(session);
      save();
      ui.wantMore = { gameId: p.gameId, minutes };
    }
    renderPlayer();
    renderPage();
    renderLayer();
  }

  // ---------- page render and routing ----------

  function signInPage() {
    return '<div class="signin"><div class="signin-card"><img src="' + BRAND_LOGO + '" alt="EVO Playground"><h1 style="font-size:22px">Sign in to EVO Playground</h1><p class="muted">Use your Evolution account.</p>' +
      '<button class="btn btn-primary btn-lg" style="width:100%" data-action="sign-in">Continue with Okta</button><p class="faint" style="font-size:12px">Prototype: sign-in is simulated.</p></div></div>';
  }

  function parseRoute() {
    return { parts: location.pathname.split('/').filter(Boolean), params: new URLSearchParams(location.search) };
  }

  function onRouteChange() {
    ui.menuOpen = false;
    ui.search = { q: '', open: false, index: 0 };
    const route = parseRoute().parts;
    if (ui.player && (ui.player.preview || route[0] !== 'game' || route[1] !== ui.player.gameId)) closePlayer();
    if (ui.drawerUser) {
      ui.drawerUser = null;
      renderLayer();
    }
    renderPage();
  }

  function navigate(path) {
    if (path !== location.pathname + location.search) history.pushState(null, '', path);
    onRouteChange();
  }

  const LIB_OPTIONS = { sort: ['latest', 'popular', 'rated', 'played', 'discussed'], type: ['all', 'arcade', 'rng'], format: ['all', 'demo', 'idea'] };

  function applyLibraryParams(params) {
    let changed = false;
    ['sort', 'type', 'author', 'format'].forEach((key) => {
      if (!params.has(key)) return;
      const value = params.get(key);
      const valid = key === 'author' ? value === 'all' || D.USERS.some((u) => u.id === value) : LIB_OPTIONS[key].includes(value);
      if (!valid) return;
      if (!changed) ui.lib = { sort: 'latest', type: 'all', author: 'all', format: 'all', q: '' };
      ui.lib[key] = value;
      changed = true;
    });
    if (changed) history.replaceState(null, '', '/library');
  }

  function renderPage() {
    memo.clear();
    if (!state.signedIn) {
      pageEl.innerHTML = signInPage();
      return;
    }
    const { parts, params } = parseRoute();
    const view = parts[0] || 'lobby';
    const routeKey = view + '/' + (parts[1] || '');
    let body;
    let active = view;
    C.reset();
    if (view === 'library') {
      applyLibraryParams(params);
      body = libraryPage();
    } else if (view === 'game') {
      body = gamePage(parts[1], parts[2] || 'overview');
      active = 'library';
    } else if (view === 'stats') body = parts[1] === 'board' ? boardPage() : statsPage();
    else if (view === 'board') {
      history.replaceState(null, '', '/stats/board');
      body = boardPage();
      active = 'stats';
    }
    else if (view === 'add') body = addPage();
    else if (view === 'ideas') body = ideasPage();
    else if (view === 'my') body = myGamesPage();
    else {
      body = lobbyPage();
      active = 'lobby';
    }
    const focused = document.activeElement && document.activeElement.id ? { id: document.activeElement.id, start: document.activeElement.selectionStart } : null;
    pageEl.innerHTML = topbar(active) + '<main id="main">' + body + '</main>' + siteFooter();
    if (focused) {
      const el = document.getElementById(focused.id);
      if (el) {
        el.focus();
        if (typeof focused.start === 'number' && el.setSelectionRange) el.setSelectionRange(focused.start, focused.start);
      }
    }
    if (routeKey !== ui.lastRouteKey) {
      window.scrollTo(0, 0);
      ui.video = { playing: false, chapter: 0 };
    }
    ui.lastRouteKey = routeKey;
    C.mountAll(pageEl);
    if (ui.player && !ui.player.preview) {
      if (!playerEl.querySelector('.inline-player')) renderPlayer();
      placePlayer();
      const slot = document.getElementById('player-slot');
      if (slot && ui.player.scrolled !== true) {
        ui.player.scrolled = true;
        window.scrollTo(0, Math.max(0, slot.getBoundingClientRect().top + window.scrollY - 80));
      }
    }
  }

  // ---------- events ----------

  function openPlayer(id) {
    const game = gameById(id);
    if (!game || game.format === 'idea') return;
    if (ui.player) closePlayer();
    ui.player = { gameId: id, startedAt: Date.now(), playable: !!demoUrl(game), session: newSession(1) };
    ui.wantMore = null;
    renderLayer();
    const route = parseRoute().parts;
    if (route[0] === 'game' && route[1] === id) {
      renderPage();
    } else {
      navigate('/game/' + id);
    }
  }

  function readFile(file, as) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      if (as === 'text') reader.readAsText(file);
      else reader.readAsDataURL(file);
    });
  }

  function takeHtmlFile(file) {
    const zip = /\.zip$/i.test(file.name);
    const entry = { name: file.name, size: file.size, zip, url: null, text: '' };
    ui.wiz.draft.htmlFile = entry;
    if (zip) {
      renderPage();
      return;
    }
    readFile(file, 'text').then((text) => {
      entry.text = text;
      entry.url = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
      renderPage();
    });
  }

  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (ui.search.open && !e.target.closest('.top-search')) closeSearch(false);
    if (ui.menuOpen && !e.target.closest('.user')) {
      ui.menuOpen = false;
      renderPage();
    }
    if (!target) {
      const row = e.target.closest('tr[data-href]');
      if (row && !e.target.closest('a')) navigate(row.dataset.href);
      return;
    }
    const action = target.dataset.action;
    const id = target.dataset.id;
    if (action === 'close-drawer' && e.target.closest('[data-stop]') && target.classList.contains('drawer-wrap')) return;

    switch (action) {
      case 'toggle-menu':
        ui.menuOpen = !ui.menuOpen;
        renderPage();
        break;
      case 'close-menu':
        ui.menuOpen = false;
        break;
      case 'sign-out':
        state.signedIn = false;
        ui.menuOpen = false;
        save();
        renderPage();
        break;
      case 'sign-in':
        state.signedIn = true;
        save();
        renderPage();
        showToast('Signed in with Okta as ' + me().name);
        break;
      case 'vote':
        e.preventDefault();
        state.upvoted[id] = !state.upvoted[id];
        save();
        renderPage();
        break;
      case 'rate':
        state.ratings[id] = Number(target.dataset.v);
        save();
        if (target.dataset.close) {
          ui.wantMore = null;
          renderLayer();
          showToast('Thanks. Rating saved.');
        }
        renderPage();
        break;
      case 'play':
        openPlayer(id);
        break;
      case 'close-player':
        closePlayer();
        break;
      case 'relaunch':
        relaunchPlayer();
        break;
      case 'download-log':
        downloadLog();
        break;
      case 'fullscreen': {
        const box = playerEl.querySelector('.player');
        try {
          box.requestFullscreen().catch(() => showToast('Fullscreen is not available here'));
        } catch (e) {
          showToast('Fullscreen is not available here');
        }
        break;
      }
      case 'dismiss-want-more':
        ui.wantMore = null;
        renderLayer();
        break;
      case 'search-pick':
        closeSearch(true);
        break;
      case 'open-user':
        if (target.closest('.search-results')) closeSearch(true);
        ui.drawerUser = id;
        ui.menuOpen = false;
        renderPage();
        renderLayer();
        break;
      case 'close-drawer':
        ui.drawerUser = null;
        renderLayer();
        break;
      case 'copy-link':
        copyText(location.href, 'Link copied');
        break;
      case 'like':
        state.likes[id] = !state.likes[id];
        save();
        renderPage();
        break;
      case 'video-play':
        ui.video.playing = !ui.video.playing;
        renderPage();
        break;
      case 'video-chapter':
        ui.video = { playing: true, chapter: Number(target.dataset.i) };
        renderPage();
        break;
      case 'lib-sort':
        ui.lib.sort = target.dataset.v;
        renderPage();
        break;
      case 'lib-type':
        ui.lib.type = target.dataset.v;
        renderPage();
        break;
      case 'lib-clear-author':
        ui.lib.author = 'all';
        renderPage();
        break;
      case 'lib-format':
        ui.lib.format = target.dataset.v;
        renderPage();
        break;
      case 'lib-clear-q':
        ui.lib.q = '';
        renderPage();
        break;
      case 'lib-reset':
        ui.lib = { sort: ui.lib.sort, type: 'all', author: 'all', format: 'all', q: '' };
        renderPage();
        break;
      case 'chart-view':
        ui.chartViews[target.dataset.key] = target.dataset.v;
        renderPage();
        break;
      case 'stats-period':
        ui.statsMonth = target.dataset.v === 'month';
        ui.statsDays = ui.statsMonth ? Math.min(30, Math.max(2, new Date().getDate())) : Number(target.dataset.v);
        renderPage();
        break;
      case 'stats-type':
        ui.statsType = target.dataset.v;
        renderPage();
        break;
      case 'stats-export':
        exportStatsCsv();
        break;
      case 'game-period':
        ui.gameDays = Number(target.dataset.v);
        renderPage();
        break;
      case 'board-period':
        ui.boardDays = Number(target.dataset.v);
        renderPage();
        break;
      case 'board-tab':
        ui.boardTab = target.dataset.v;
        renderPage();
        break;
      case 'wiz-step': {
        const to = Number(target.dataset.i);
        if (to > ui.wiz.step && Object.keys(wizErrors(ui.wiz.step)).length) {
          ui.wiz.tried[ui.wiz.step] = true;
        } else {
          ui.wiz.step = to;
        }
        renderPage();
        break;
      }
      case 'wiz-next':
        ui.wiz.tried[ui.wiz.step] = true;
        if (!Object.keys(wizErrors(ui.wiz.step)).length) ui.wiz.step += 1;
        renderPage();
        break;
      case 'wiz-back':
        ui.wiz.step -= 1;
        renderPage();
        break;
      case 'wiz-clear':
        ui.wiz.draft[target.dataset.key] = null;
        renderPage();
        break;
      case 'wiz-test': {
        const f = ui.wiz.draft.htmlFile;
        if (f && f.url) {
          ui.player = { preview: draftGame('preview'), url: f.url, startedAt: Date.now(), session: newSession(1) };
          renderPlayer();
        }
        break;
      }
      case 'wiz-publish': {
        const firstBad = [0, 1, 2].find((s) => Object.keys(wizErrors(s)).length);
        if (firstBad !== undefined) {
          ui.wiz.tried[firstBad] = true;
          ui.wiz.step = firstBad;
          renderPage();
          showToast('Fix the highlighted fields first');
        } else {
          publish();
        }
        break;
      }
      case 'edit-demo':
        ui.manageEdit = ui.manageEdit === id ? null : id;
        ui.manageDraft = { file: null };
        renderPage();
        break;
      case 'cancel-demo':
        ui.manageEdit = null;
        renderPage();
        break;
      case 'save-demo':
        saveDemo(id);
        break;
      case 'toggle-hidden': {
        const g = gameById(id);
        g.hidden = !g.hidden;
        persistGame(g, { hidden: g.hidden });
        renderPage();
        showToast(g.hidden ? 'Hidden from the library' : 'Visible in the library');
        break;
      }
      default:
        break;
    }
  });

  // Same-origin links are routes of this page; the server returns this html for all of them.
  document.addEventListener('click', (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const link = e.target.closest && e.target.closest('a[href]');
    if (!link || link.target || link.hasAttribute('download')) return;
    const href = link.getAttribute('href');
    if (!href.startsWith('/') || href.startsWith('//')) return;
    e.preventDefault();
    navigate(href);
  });

  function persistGame(game, patch) {
    const added = state.added.find((g) => g.id === game.id);
    if (added) Object.assign(added, patch);
    else state.overrides[game.id] = Object.assign(state.overrides[game.id] || {}, patch);
    save();
  }

  function bumpVersion(version) {
    const parts = version.split('.').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return '0.1.0';
    if (parts[0] === 0 && parts[1] === 0) return '0.1.0';
    parts[2] += 1;
    return parts.join('.');
  }

  function saveDemo(id) {
    const g = gameById(id);
    const f = ui.manageDraft.file;
    if (!f) {
      showToast('Choose a demo file first');
      return;
    }
    let demo;
    if (f.zip) demo = { kind: 'uploaded-zip', fileName: f.name };
    else {
      demo = { kind: 'uploaded', fileName: f.name };
      memory.demoUrls[id] = f.url;
      try {
        if (f.text.length < MAX_STORED_DEMO) localStorage.setItem(DEMO_KEY + id, f.text);
      } catch (e) {
        demo.sessionOnly = true;
      }
    }
    const patch = { demo, format: 'demo', version: bumpVersion(g.version), updatedDaysAgo: 0, stage: g.stage === 'idea' ? 'prototype' : g.stage };
    Object.assign(g, patch);
    persistGame(g, patch);
    ui.manageEdit = null;
    renderPage();
    showToast(g.title + ' updated to v' + g.version);
  }

  document.addEventListener('focusin', (e) => {
    if (e.target.id === 'global-search' && ui.search.q.trim()) {
      ui.search.open = true;
      updateSearch();
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'global-search') {
      ui.search = { q: t.value, open: true, index: 0 };
      updateSearch();
      return;
    }
    if (t.id === 'lib-q') {
      ui.lib.q = t.value;
      renderPage();
      return;
    }
    if (t.dataset.wiz) {
      ui.wiz.draft[t.dataset.wiz] = t.value;
      const live = document.getElementById('wiz-live');
      if (live) live.innerHTML = gameCard(draftGame('preview'));
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'lib-sort-select') {
      ui.lib.sort = t.value;
      renderPage();
      return;
    }
    if (t.id === 'stats-rank') {
      ui.statsSort = { key: t.value, dir: -1 };
      renderPage();
      return;
    }
    if (t.id === 'switch-user') {
      state.currentUserId = t.value;
      ui.menuOpen = false;
      save();
      renderPage();
      showToast('Now signed in as ' + me().name);
      return;
    }
    if (t.dataset.wizChoice) {
      ui.wiz.draft[t.dataset.wizChoice] = t.value;
      if (t.dataset.wizChoice === 'type' && t.value !== 'rng') ui.wiz.draft.core = '';
      renderPage();
      return;
    }
    if (t.dataset.wizCheck) {
      ui.wiz.draft[t.dataset.wizCheck] = t.checked;
      renderPage();
      return;
    }
    if (t.dataset.file && t.files && t.files[0]) {
      const file = t.files[0];
      const kind = t.dataset.file;
      if (kind === 'html') takeHtmlFile(file);
      if (kind === 'cover') {
        readFile(file, 'dataUrl').then((dataUrl) => {
          ui.wiz.draft.cover = { name: file.name, url: URL.createObjectURL(file), dataUrl };
          renderPage();
        });
      }
      if (kind === 'video') {
        ui.wiz.draft.video = { name: file.name, size: file.size };
        renderPage();
      }
      if (kind === 'manage') {
        const zip = /\.zip$/i.test(file.name);
        const entry = { name: file.name, size: file.size, zip, url: null, text: '' };
        ui.manageDraft.file = entry;
        if (zip) renderPage();
        else {
          readFile(file, 'text').then((text) => {
            entry.text = text;
            entry.url = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
            renderPage();
          });
        }
      }
    }
  });

  document.addEventListener('submit', (e) => {
    const form = e.target;
    if (form.dataset.form === 'idea') {
      e.preventDefault();
      if (ui.idea.status === 'sending') return;
      const data = new FormData(form);
      const idea = { title: data.get('title'), description: data.get('description'), imageUrl: data.get('imageUrl'), submittedBy: data.get('submittedBy') };
      ui.idea = { status: 'sending', reason: '' };
      renderPage();
      fetch('/api/ideas', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(idea) })
        .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
        .then(({ ok, body }) => {
          ui.idea = ok ? { status: 'sent', reason: '' } : { status: 'error', reason: body.error === 'webhook_not_configured' ? 'IDEAS_WEBHOOK_URL is not set on the server (see .env.example)' : 'Could not post: ' + body.error };
          renderPage();
        })
        .catch(() => {
          ui.idea = { status: 'error', reason: 'Network error reaching the server' };
          renderPage();
        });
      return;
    }
    if (form.dataset.form !== 'comment') return;
    e.preventDefault();
    const text = form.querySelector('textarea').value.trim();
    if (!text) {
      showToast('Write something first');
      return;
    }
    state.comments.push({ id: 'lc' + Date.now(), gameId: form.dataset.id, userId: state.currentUserId, createdAt: Date.now(), likes: 0, text });
    save();
    renderPage();
    showToast('Comment posted');
  });

  ['dragover', 'dragenter'].forEach((type) =>
    document.addEventListener(type, (e) => {
      const zone = e.target.closest && e.target.closest('[data-drop]');
      if (!zone) return;
      e.preventDefault();
      zone.classList.add('over');
    }),
  );
  document.addEventListener('dragleave', (e) => {
    const zone = e.target.closest && e.target.closest('[data-drop]');
    if (zone) zone.classList.remove('over');
  });
  document.addEventListener('drop', (e) => {
    const zone = e.target.closest && e.target.closest('[data-drop]');
    if (!zone) return;
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) takeHtmlFile(file);
  });

  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t.id === 'global-search') {
      const count = document.querySelectorAll('#search-results .sr-item').length;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (count) ui.search.index = (ui.search.index + (e.key === 'ArrowDown' ? 1 : count - 1)) % count;
        ui.search.open = true;
        updateSearch();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const active = document.querySelector('#search-results .sr-item.on');
        if (active) active.click();
      } else if (e.key === 'Escape') {
        t.value = '';
        closeSearch(true);
        t.blur();
      }
      return;
    }
    const typing = t.closest && t.closest('input, textarea, select, [contenteditable]');
    if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) {
      const input = document.getElementById('global-search');
      if (input) {
        e.preventDefault();
        input.focus();
      }
      return;
    }
    if (e.key !== 'Escape') return;
    if (ui.player && ui.player.preview) closePlayer();
    else if (ui.drawerUser) {
      ui.drawerUser = null;
      renderLayer();
    } else if (ui.menuOpen) {
      ui.menuOpen = false;
      renderPage();
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => C.mountAll(document), 150);
    placePlayer();
  });
  new ResizeObserver(placePlayer).observe(pageEl);

  window.addEventListener('popstate', onRouteChange);

  renderPage();
})();

<script>
/* Motion layer: observes #page and animates what the app renders. It never edits app state or markup structure. */
(function () {
  if (typeof IntersectionObserver === 'undefined' || typeof MutationObserver === 'undefined') return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var page = document.getElementById('page');
  if (!page) return;
  var lastRoute = null;
  var lastActionClick = 0;
  var gen = 0;
  var sweep = function () {};

  var ENTRY = 'main > *, .lh-stats > *, .resume-grid > *, .st-page > *, .st-hero > *, .st-two > *, .st-rated-grid > *, .st-contrib > *, .grid > *, .top-games > *, .side-games > *, .cols-2 > *, .stack > *, .section, .panel, .st-panel, .comment, .choice-grid > *';
  var COUNTERS = '.lh-stat b, .st-big, .st-mid, .st-live-metrics b, .st-players, .st-pos b, .st-rating b, .st-contrib-pct, .st-role-pct, .st-strip b, .st-ring b, .st-comp, .st-bracket-legend b, .st-panel-foot b';
  var BARS = '.st-track > div, .st-share-bar i, .split > div, .hbar .fill, .inline-bar';
  var NUM = /\d[\d,]*(?:\.\d+)?/g;

  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-action]')) lastActionClick = Date.now();
  }, true);

  function easeOut(p) { return 1 - Math.pow(1 - p, 4); }

  function formatToken(token, value) {
    var decimals = (token.split('.')[1] || '').length;
    var s = value.toFixed(decimals);
    if (token.indexOf(',') > -1) s = Number(s).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    if (/^0\d/.test(token)) while (s.length < token.length) s = '0' + s;
    return s;
  }

  function counterState(el) {
    var final = el.textContent;
    var tokens = final.match(NUM);
    if (!tokens) return null;
    var values = tokens.map(function (t) { return parseFloat(t.replace(/,/g, '')); });
    function render(e) {
      var i = 0;
      return final.replace(NUM, function (m) { return formatToken(m, values[i++] * e); });
    }
    return { final: final, render: render };
  }

  function setupCounters(root, myGen) {
    var items = [];
    root.querySelectorAll(COUNTERS).forEach(function (el) {
      var textOnly = Array.prototype.every.call(el.childNodes, function (n) { return n.nodeType === 3; });
      if (!textOnly) return;
      var st = counterState(el);
      if (!st) return;
      el.textContent = st.render(0);
      items.push({ el: el, st: st });
    });
    return items;
  }

  function runCounter(item, delay) {
    var start = performance.now() + delay;
    var dur = 1100;
    (function frame(t) {
      if (!item.el.isConnected) return;
      var p = Math.max(0, Math.min(1, (t - start) / dur));
      item.el.textContent = p >= 1 ? item.st.final : item.st.render(easeOut(p));
      if (p < 1) requestAnimationFrame(frame);
    })(performance.now());
  }

  function setupBars(root) {
    var items = [];
    root.querySelectorAll(BARS).forEach(function (el) {
      var w = el.style.width;
      if (!w) return;
      el.style.transition = 'none';
      el.style.width = '0px';
      items.push({ el: el, w: w });
    });
    return items;
  }

  function runBar(item, delay) {
    var el = item.el;
    el.getBoundingClientRect();
    el.style.transition = 'width 1000ms cubic-bezier(0.2, 0.8, 0.2, 1) ' + delay + 'ms';
    el.style.width = item.w;
    setTimeout(function () { el.style.transition = ''; }, 1200 + delay);
  }

  function indexIn(el) {
    return el.parentElement ? Array.prototype.indexOf.call(el.parentElement.children, el) : 0;
  }

  function setup(mode) {
    var myGen = ++gen;
    var main = page.querySelector('main');
    var scope = main || page;
    var gameRoute = /^\/game\//.test(location.pathname);
    var observed = [];
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var skipped = !en.isIntersecting && en.boundingClientRect.bottom < 0;
        if (!en.isIntersecting && !skipped) return;
        io.unobserve(en.target);
        var fn = en.target.__mo;
        en.target.__mo = null;
        fn && fn(skipped);
      });
    }, { rootMargin: '0px 0px -5% 0px', threshold: 0.04 });

    function watch(el, fn) { el.__mo = fn; io.observe(el); observed.push(el); }
    sweep = function () {
      observed = observed.filter(function (el) {
        if (!el.__mo) return false;
        if (!el.isConnected) return false;
        var r = el.getBoundingClientRect();
        var skipped = r.bottom < 0;
        if (!skipped && r.top > window.innerHeight * 0.95) return true;
        io.unobserve(el);
        var fn = el.__mo;
        el.__mo = null;
        fn(skipped);
        return false;
      });
    };

    if (mode === 'full') {
      var cand = Array.prototype.slice.call(scope.querySelectorAll(ENTRY)).filter(function (el) { return !el.hidden && el.tagName !== 'SCRIPT'; });
      var set = new Set(cand);
      cand.forEach(function (el) {
        var depth = 0;
        for (var p = el.parentElement; p && p !== scope; p = p.parentElement) if (set.has(p)) depth++;
        var kind = gameRoute ? 'mo-fade' : depth > 0 ? 'mo-sub' : 'mo-up';
        var i = Math.min(indexIn(el), 8);
        var delay = depth > 0 ? 90 + i * 55 : i * 60;
        el.classList.add('mo');
        watch(el, function (instant) {
          if (instant) { el.classList.remove('mo'); return; }
          el.style.setProperty('--d', delay + 'ms');
          el.classList.remove('mo');
          el.classList.add('mo-in', kind);
        });
      });
      scope.querySelectorAll('table.data tbody tr').forEach(function (tr, i) {
        tr.classList.add('mo');
        watch(tr, function (instant) {
          if (instant) { tr.classList.remove('mo'); return; }
          tr.style.setProperty('--d', 120 + Math.min(i, 14) * 38 + 'ms');
          tr.classList.remove('mo');
          tr.classList.add('mo-in', 'mo-row');
        });
      });
    }

    setupCounters(scope, myGen).forEach(function (item, i) {
      watch(item.el, function (instant) { if (instant) item.el.textContent = item.st.final; else runCounter(item, mode === 'full' ? 200 : 0); });
    });
    setupBars(scope).forEach(function (item, i) {
      watch(item.el, function (instant) { if (instant) { item.el.style.transition = ''; item.el.style.width = item.w; return; } runBar(item, (mode === 'full' ? 250 : 0) + Math.min(indexIn(item.el), 8) * 70); });
    });
  }

  function onPageChange() {
    var route = location.pathname;
    var routeChanged = route !== lastRoute;
    lastRoute = route;
    if (routeChanged) setup('full');
    else if (Date.now() - lastActionClick < 400) setup('soft');
  }

  new MutationObserver(onPageChange).observe(page, { childList: true });
  if (page.children.length) onPageChange();

  /* Overlays: animate only when a layer goes from empty to filled, so in-place re-renders don't replay it */
  ['layer', 'player-layer'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    var wasEmpty = !el.children.length;
    new MutationObserver(function () {
      var empty = !el.children.length;
      if (wasEmpty && !empty) {
        var node = el.firstElementChild;
        node.classList.add('layer-enter');
        setTimeout(function () { node.classList.remove('layer-enter'); }, 500);
      }
      wasEmpty = empty;
    }).observe(el, { childList: true });
  });

  /* Pointer glow on cards */
  var glowRaf = 0;
  document.addEventListener('mousemove', function (e) {
    var card = e.target.closest && e.target.closest('.st-card, .st-rated-card, .st-contrib-card, .card');
    if (!card || glowRaf) return;
    var x = e.clientX, y = e.clientY;
    glowRaf = requestAnimationFrame(function () {
      glowRaf = 0;
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', x - r.left + 'px');
      card.style.setProperty('--my', y - r.top + 'px');
    });
  }, { passive: true });

  /* Timer fallback so content never stays hidden if observer callbacks are delayed (background tab, stalled paint) */
  setInterval(function () { if (document.querySelector('.mo')) sweep(); }, 350);
  window.addEventListener('beforeprint', function () {
    document.querySelectorAll('.mo').forEach(function (el) { el.classList.remove('mo'); });
  });

  var sweepTick = false;
  window.addEventListener('scroll', function () {
    if (sweepTick) return;
    sweepTick = true;
    requestAnimationFrame(function () { sweepTick = false; sweep(); });
  }, { passive: true });

  /* Back to top */
  var top = document.createElement('button');
  top.type = 'button';
  top.className = 'to-top';
  top.setAttribute('aria-label', 'Back to top');
  top.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg>';
  top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.body.appendChild(top);
  var topTick = false;
  window.addEventListener('scroll', function () {
    if (topTick) return;
    topTick = true;
    requestAnimationFrame(function () {
      topTick = false;
      top.classList.toggle('show', window.scrollY > 720);
    });
  }, { passive: true });
})();

<script>
/* Site-wide UX: per-page tab titles, skip link, focus handoff on navigation */
(function () {
  var page = document.getElementById('page');
  if (!page) return;
  var skip = document.createElement('a');
  skip.className = 'skip-link';
  skip.href = '#main';
  skip.textContent = 'Skip to content';
  skip.addEventListener('click', function (e) {
    e.preventDefault();
    var main = document.getElementById('main');
    if (main) { main.setAttribute('tabindex', '-1'); main.focus({ preventScroll: false }); }
  });
  document.body.insertBefore(skip, document.body.firstChild);
  var lastRoute = null;
  function sync() {
    var h1 = page.querySelector('main h1');
    var name = h1 ? h1.textContent.trim() : '';
    document.title = name ? name + ' · EVO Playground' : 'EVO Playground';
    var route = location.pathname;
    if (lastRoute !== null && route !== lastRoute) {
      var main = document.getElementById('main');
      if (main && !(document.activeElement && document.activeElement.id === 'global-search')) { main.setAttribute('tabindex', '-1'); main.focus({ preventScroll: true }); }
    }
    lastRoute = route;
  }
  new MutationObserver(sync).observe(page, { childList: true });
  sync();
})();
</script>
