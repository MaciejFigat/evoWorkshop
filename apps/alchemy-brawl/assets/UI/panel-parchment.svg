le cx="31.23" cy="6.23" r="0.77" fill="#d9dde0" opacity=".9"/><circle cx="7" cy="32" r="2.2" fill="url(#iron)" stroke="#1c130b" stroke-width="1"/><circle cx="6.23" cy="31.23" r="0.77" fill="#d9dde0" opacity=".9"/></g><g transform="translate(318 318) scale(-1 -1)"><path d="M0 0 H54 L46 14 H14 V46 L0 54 Z" fill="url(#iron)" stroke="#1c130b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M6 6 H40 M6 6 V40" stroke="#d9dde0" stroke-opacity=".5" stroke-width="1.5"/><circle cx="8" cy="8" r="3" fill="url(#iron)" stroke="#1c130b" stroke-width="1"/><circle cx="6.95" cy="6.95" r="1.0499999999999998" fill="#d9dde0" opacity=".9"/><circle cx="32" cy="7" r="2.2" fill="url(#iron)" stroke="#1c130b" stroke-width="1"/><circle cx="31.23" cy="6.23" r="0.77" fill="#d9dde0" opacity=".9"/><circle cx="7" cy="32" r="2.2" fill="url(#iron)" stroke="#1c130b" stroke-width="1"/><circle cx="6.23" cy="31.23" r="0.77" fill="#d9dde0" opacity=".9"/></g>
<path d="M120 10 H200 M120 310 H200 M10 120 V200 M310 120 V200" stroke="#7a6d5c" stroke-width="2"/>
</g>
</svg>
