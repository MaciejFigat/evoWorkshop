<svg xmlns="http://www.w3.org/2000/svg" width="480" height="96" viewBox="0 0 480 96">
<defs>
  <filter id="tex" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.07  0 0 0 0 0.04  0.8 0 0 0 -0.3" result="a"/>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="t"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.35" numOctaves="3" seed="2" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.07  0 0 0 0 0.03  1.3 0 0 0 -0.45" result="a"/>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="t"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>

  <linearGradient id="woodH" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#3a2614"/><stop offset=".35" stop-color="#8a5c33"/>
    <stop offset=".55" stop-color="#9c6b3d"/><stop offset="1" stop-color="#3a2614"/></linearGradient>
  <linearGradient id="woodV" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#a5733f"/><stop offset=".5" stop-color="#7a5129"/><stop offset="1" stop-color="#3f2913"/></linearGradient>
  <linearGradient id="iron" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#b9bcc0"/><stop offset=".45" stop-color="#6b6f74"/><stop offset="1" stop-color="#2e3033"/></linearGradient>
  <linearGradient id="ironH" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#2e3033"/><stop offset=".4" stop-color="#9ea2a7"/><stop offset=".6" stop-color="#7d8186"/><stop offset="1" stop-color="#2e3033"/></linearGradient>
  <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#ffe7a3"/><stop offset=".45" stop-color="#d4a64a"/><stop offset="1" stop-color="#6e4f17"/></linearGradient>
  <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>

  <linearGradient id="hpfill" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#5c0b0b"/><stop offset=".55" stop-color="#c22a17"/><stop offset=".85" stop-color="#f08a24"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
  <linearGradient id="gloss" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
  <radialGradient id="ruby" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ff9b8a"/><stop offset=".5" stop-color="#b3261e"/><stop offset="1" stop-color="#4a0608"/></radialGradient>
</defs>

